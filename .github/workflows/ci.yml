name: CI

on:
  # Short-lived branches (feat/*, fix/*, chore/*, refactor/*, hotfix/*) are
  # deliberately NOT here. They used to be, and every commit on one with an open
  # PR fired BOTH a push run and a pull_request run against the same SHA — two
  # complete 9-job runs, 22 check rows per PR (verified on PR #254: every gate
  # appeared exactly twice). The `concurrency` group below cannot dedupe them
  # because github.ref is refs/heads/<branch> for push and refs/pull/N/merge for
  # pull_request, so they land in different groups and both proceed.
  #
  # That was not merely wasteful, it was unsound. INFRA-329 (2026-08-06, PR #244):
  # `gh pr checks --watch` exited reporting all 9 gates green while the
  # PR-triggered run had hit the esm.sh flake, because it read only one of the two
  # runs; `gh pr merge` then refused with `Required status check "CI pass" is
  # failing`. Every short-lived branch PRs into main or development, so the
  # pull_request trigger already covers 100% of the code that can merge — the push
  # run added no coverage, only a second run for a --watch to misread.
  #
  # `main` and `development` are KEPT. They cannot receive direct pushes
  # (required_PR + enforce_admins are both on), so a run here is always a
  # post-merge integration signal on a merge commit — the only check that runs
  # after `gh pr merge --admin`, which /b-close uses on every close and which
  # bypasses PR-time protection. One run per merge, no duplication.
  #
  # Known and accepted: a release PR (development -> main) still gets two runs,
  # because its head IS development. /b-release 6.5 documents that and verifies
  # via statusCheckRollup rather than --watch, which is the robust fix regardless
  # of run count.
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened]
  schedule:
    # Daily health check — verifies the suite still passes against current
    # branches even with no new commits. Hourly was overkill for pre-launch.
    - cron: '0 9 * * *'

env:
  # INFRA-346: Node 20 went EOL 2026-04-30. 24 is the ACTIVE LTS (until 2026-10-20,
  # EOL 2028-04-30); 22 has been in maintenance since 2025-10-21, so it would put this
  # ticket back on the board in months. react-native@0.85.3 and metro@0.84.4 both
  # declare engines.node '^20.19.4 || ^22.13.0 || ^24.3.0 || >= 25.0.0', and
  # @types/node was already pinned to ^24 (MAINT-162) — this collapses a two-major
  # skew between the types tsc checked against and the runtime CI executed.
  # Floating major on purpose: absorbs security patches without a bump treadmill.
  # Keep in sync with app/.nvmrc and app/package.json engines.node.
  # NOT the same axis as INFRA-337, which bumped each action's `runs.using: node20`.
  NODE_VERSION: '24'
  # INFRA-354: pinned, NOT floating. The edge-functions gate previously used
  # `deno-version: v1.x`, which drifted silently, is EOL, and matched neither the
  # local toolchain (2.8.2) nor the Supabase Edge Runtime the functions deploy to.
  # The pin is also a hard prerequisite for the vendored resolution below:
  # `deno vendor` was REMOVED in Deno 2, `supabase/functions/deno.lock` is lockfile
  # format v5 (Deno 1.x reads v3 at most), and the two majors disagree on the vendor
  # layout (manifest.json vs import_map.json). Bump this and the vendor tree together.
  DENO_VERSION: '2.8.2'
  # The app's package.json depends on @mp2ez/being-design-system (private
  # GitHub Packages release). The app/.npmrc references ${GITHUB_TOKEN}
  # which we surface from the workflow's automatic token here. Read-only
  # `packages: read` permission is sufficient for `npm ci`.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Default token permissions. `packages: read` lets npm ci pull from
# GitHub Packages without an explicit per-step env or PAT.
permissions:
  contents: read
  packages: read

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# There is deliberately NO `prepare` job. One used to sit here, described as
# "single install, subsequent jobs restore from cache rather than running npm ci
# each time (9 jobs × 1-2 min install = 10+ min wasted)". That description was
# wrong about how Actions works and the job cost ~33s of pure serial latency on
# every run:
#
#   - Actions jobs do not share a filesystem. Every job below still ran its own
#     `npm ci` regardless (the `prepare` job installed into a VM that was then
#     discarded). The only thing shared was actions/setup-node's ~/.npm tarball
#     cache, keyed on the package-lock hash.
#   - Measured on run 31227306205: `prepare` and every downstream job all logged
#     `Cache restored from key: node-cache-Linux-x64-npm-0670e3c2…` — the SAME
#     pre-existing key, saved by an earlier run. `prepare` warmed nothing; it
#     just made 8 jobs wait 29s + ~9s scheduling before starting.
#   - On a lockfile change `prepare` does warm a cold cache (measured on run
#     31225879268: `npm cache is not found` → `Cache saved with the key: …`),
#     but the cold-vs-warm delta is only ~5s (cold `npm ci` 23s, warm 14-18s)
#     and it is a delta each job would otherwise pay IN PARALLEL. Paying 29s of
#     serial time to save 8 jobs ~5s of parallel time is a net loss in both
#     cases.
#
# Consequence to expect, not a bug: on the first run after a package-lock.json
# change, all jobs miss the cache simultaneously and race to save the same key.
# One wins; the others log `Unable to reserve cache with key …, another job may
# be creating this cache` and continue. That warning is benign.
#
# Do not reintroduce a fan-in install job without measuring the serialization
# cost against the parallel-savings-PER-CHILD (not the total across children).
# The correct fix for slow installs is a faster install, not an earlier one.
jobs:
  # Static analysis — fast, runs in parallel with tests below.
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: cd app && npm ci --prefer-offline --no-audit

      - name: Typecheck
        run: cd app && npm run typecheck

  # ESLint job gates on the per-file baseline ratchet (W4 paydown).
  # The codebase carries ~955 errors of accumulated debt from 5+ months
  # of unguarded dev. Rather than blocking PRs on all of them, the
  # `lint:baseline` script compares each file's current error count to
  # the snapshot in app/.eslint-baseline.json. New errors fail; existing
  # errors don't. Improvements are reported and can be ratcheted in via
  # `npm run lint:baseline -- --update`.
  lint:
    name: ESLint (baseline ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: cd app && npm ci --prefer-offline --no-audit

      - name: Lint (baseline ratchet)
        run: cd app && npm run lint:baseline

  # Crisis-authority validation — runs first among the test jobs because a
  # crisis-flow regression is the highest-severity failure. Gates the rest.
  crisis-validation:
    name: Crisis authority validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: cd app && npm ci --prefer-offline --no-audit

      - name: Crisis authority validation
        run: cd app && npm run validate:crisis-authority

  # Clinical accuracy — PHQ-9 / GAD-7 / Stoic content validation.
  # Decoupled from crisis-validation: the original `needs: crisis-validation`
  # dependency was aspirational (crisis-first gating), but clinical and
  # crisis test suites are independent and clinical should run regardless
  # of crisis's status. With both as parallel siblings of `prepare`, a
  # broken crisis script no longer hides clinical-suite regressions.
  clinical-validation:
    name: Clinical authority validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: cd app && npm ci --prefer-offline --no-audit

      - name: Clinical authority validation
        run: cd app && npm run validate:clinical-authority

  # Full unit + integration test suite — catches the regression tests added
  # in Phase 0 (CollapsibleCrisisButton.a11y.test.ts and
  # AuthenticationService.sec03.test.ts) via Jest auto-discovery.
  #
  # Gating: as of the W1 debt paydown, broken-import failures are fixed and
  # the running suites enforce. 5 integration tests are temporarily ignored
  # via testPathIgnorePatterns in jest.config.js (see TODO comments there)
  # pending separate fixes for SecureStorageService singleton timers,
  # MaskedView native mock, and assessment-store API drift.
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: cd app && npm ci --prefer-offline --no-audit

      - name: Unit tests
        # --coverage intentionally omitted: this is a SUBSET run (jest
        # --testPathPattern=unit) so per-file coverage would always fall
        # below the global thresholds in jest.config.js (those are sized
        # for the full suite). Coverage enforcement belongs in a
        # dedicated full-suite job; subset runs validate their slice.
        run: cd app && npm run test:unit -- --ci --testTimeout=20000

      - name: Integration tests
        run: cd app && npm run test:integration -- --ci --testTimeout=30000

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: app/coverage/
          retention-days: 14

  # Security + compliance — encryption, HIPAA-adjacent checks, dependency
  # audit. npm audit threshold is `high` (not `moderate`) until the
  # 5-month-old lockfile is refreshed — see audit-roadmap.md Phase 0/3 for
  # the planned dependency refresh.
  security:
    name: Security + compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: cd app && npm ci --prefer-offline --no-audit

      - name: Legal docs registry drift check
        # Verifies docs/legal/*.md filenames match the require() calls and
        # LegalDocumentType registry in app/src/features/profile/content/
        # legalDocuments.ts. The app statically requires every legal doc via
        # Metro; drift breaks the bundle silently. CI does not run Metro,
        # so this guard is the only structural protection against the bug
        # class. See scripts/legal-registry.js for the comparison rules.
        run: node scripts/legal-registry.js

      - name: Service-singleton setInterval guard check
        # INFRA-177: Verifies every setInterval call in service files is
        # guarded by `process.env.NODE_ENV === 'test'` (either at the call
        # site or at the calling method). Prevents the bug class that
        # required INFRA-144 (2 services) and INFRA-175 (5 services) fixes
        # — unguarded singleton init timers leak into Jest's event loop
        # and hang CI at the 15-min wall. Escape hatch via
        # `// interval-guard-skip: <reason>` comment for stress-test or
        # other self-clearing patterns.
        run: node scripts/check-service-interval-guards.js

      - name: Crisis-dial guard check
        # DEBUG-314: Verifies every tel:/sms: dial routes through
        # `openCrisisUrl`, which owns the canOpenURL guard, the manual-dial
        # fallback Alert and the CRISIS audit record. A bare Linking.openURL
        # fails SILENTLY when the scheme cannot be opened — no dial, no alert,
        # no log — which is a false negative on the app's one
        # zero-false-negative path.
        #
        # The primary pin is `app/__tests__/safety/crisisDialGuard.test.ts`,
        # which shares this script's detection logic and runs in `precommit` on
        # every machine. This step exists because `test:safety` is not a CI job
        # and `--no-verify` is permitted on hotfix/* branches, so CI must not
        # depend on the local hook having run.
        run: cd app && npm run check:crisis-dial

      - name: Security test suite
        # --coverage omitted on subset runs (see Unit tests rationale).
        #
        # This step is the ONLY encryption gate. Two steps used to precede it —
        # "Compliance authority validation" (`validate:compliance-authority`,
        # which is a pure alias: `npm run test:encryption && echo ✅`) and
        # "Encryption test suite" (`test:encryption`) — and BOTH were fully
        # subsumed here. Verified in the run 31227306205 log: the EncryptionService
        # suites executed three times in this one job (lines 2920, 5609, then
        # 8985/11066), reporting an identical `Test Suites: 2 passed, 25 tests`
        # each time. `test:security` is `jest --testPathPattern=security`, and
        # both suites live at src/core/services/security/__tests__/, so the path
        # pattern already sweeps them in.
        #
        # ⚠️ COVERAGE DEPENDS ON DIRECTORY LAYOUT. The encryption suites are
        # covered here because their PATH contains "security", not because
        # anything names them. If EncryptionService.test.ts or
        # EncryptionService.realcrypto.test.ts ever move out of a `security/`
        # directory, this gate silently stops running them — AES-256 at rest is
        # a non-negotiable in CLAUDE.md, so restore an explicit
        # `npm run test:encryption` step here if that move happens.
        run: cd app && npm run test:security -- --ci --testTimeout=15000

      - name: npm audit
        # MAINT-182: switched from raw `npm audit --audit-level=high` to
        # `audit-ci` with an explicit allowlist at app/.audit-ci.json.
        # Three transitive CVEs in @expo/config-plugins@56.0.8 are
        # allowlisted (GHSA-ph9p-34f9-6g65 tmp path traversal,
        # GHSA-6vfc-qv3f-vr6c markdown-it ReDoS, GHSA-w5hq-g745-h8pq
        # uuid bounds check) — all build-time only, no patched stable
        # version available. Threshold is `moderate` (tightened from the
        # prior `high`) since the allowlist gives precise control.
        # Drop the GHSAs from .audit-ci.json when @expo/config-plugins
        # >=56.0.9 ships as stable.
        #
        # Historical context (kept for archaeology): the W3 paydown's
        # `npm audit fix` cleared 11 high+critical vulns (xmldom,
        # brace-expansion, fast-uri, flatted, handlebars, lodash,
        # minimatch, node-forge, picomatch, tar, undici) via lockfile
        # updates only. The remaining moderate floor was the Expo
        # transitive chain; threshold was raised to `high` as an interim
        # measure pending the Expo upgrade. audit-ci with an explicit
        # allowlist replaces that interim.
        run: cd app && npx audit-ci --config .audit-ci.json

  # Accessibility — WCAG AA validation + a11y test suite. Strict gate
  # as of Phase B+C paydown. Root causes addressed:
  #   - Global Jest mocks for react-native-reanimated and gesture-handler
  #     (both blocked component rendering with TurboModule errors).
  #   - RadioGroup structural a11y (Phase A: accessibilityRole moved to
  #     outer testID-bearing View; Boolean(isDisabled); preventDefault?.()).
  #   - CollapsibleCrisisButton testID propagation (now reaches the
  #     interactive Pressable, not just its -icon child).
  #   - Crisis button label updated to "I need support" (per crisis
  #     specialist guidance — first-person agency, gentler for repeated
  #     screen-reader exposure).
  # 45/45 accessibility tests pass.
  accessibility:
    name: Accessibility (WCAG AA)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: cd app && npm ci --prefer-offline --no-audit

      - name: Accessibility test suite
        # A preceding "Accessibility validation" step used to run
        # `validate:accessibility`, which is a pure alias for this same command
        # (`npm run test:accessibility && echo ✅`). Both steps reported an
        # identical `Test Suites: 12 passed, Tests: 98 passed` in the run
        # 31227306205 log (lines 1137 and 2073) — byte-identical work, twice.
        # This variant is kept because it carries the CI flags.
        run: cd app && npm run test:accessibility -- --ci --testTimeout=20000

  # Performance regression sweep. Strict gate as of Phase A paydown.
  # Root causes fixed:
  #   - Zustand snapshot-staleness pattern in assessment-performance
  #     (was caching getState() once; now refreshed on each read).
  #   - assessment-store API drift (primaryTrigger vs triggerType).
  #   - SecureStorageService cleanup setInterval kept Jest alive past
  #     completion — now skipped in NODE_ENV=test.
  #   - CI threshold variance recalibrated.
  # CORRECTED 2026-07-25 (MAINT-307): this comment used to claim "production
  # budgets still enforced via perf:crisis/perf:breathing/perf:launch scripts".
  # Those scripts were deleted in MAINT-166 PR 7 (they ran zero matching tests),
  # so the claim was false. What this job actually enforces is the crisis
  # DETECTION <200ms budget, via assessment-performance.test.ts. The crisis
  # BUTTON budget has only a coarse jest proxy (CollapsibleCrisisButton.
  # behavioral.test.tsx). App launch <2s and check-in transition <500ms are
  # enforced by nothing.
  # UPDATED 2026-07-25 (INFRA-306): breathing 60fps is still not MEASURED
  # anywhere — no macOS runner exists, so no CI job can render a frame. What
  # this job now adds is a structural PROXY ("Breathing-worklet purity guard")
  # that fails when the PERF-01/PERF-02 regression shape returns to the
  # animation path. Do not read that step as an fps gate; the on-device
  # UI-thread measurement is INFRA-309.
  # Deferred (testPathIgnorePatterns in jest.config.js):
  #   - sync-performance-validation + week3-analytics-performance:
  #     tests reference older service APIs (new SyncCoordinator() when
  #     it's a singleton, .shutdown() removed, crypto/auth mock shapes
  #     changed). Need rewrite, not patching.
  performance:
    name: Performance regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: cd app && npm ci --prefer-offline --no-audit

      # INFRA-306 Layer A. STRUCTURAL PROXY, not a frame-rate measurement — this
      # runner is ubuntu-latest and cannot render a frame. It fails when the
      # PERF-01/PERF-02 regression shape (commit ff591f3a) reappears on the
      # breathing animation path. The breathing 60fps budget itself remains
      # unmeasured; the on-device measurement is INFRA-309.
      - name: Breathing-worklet purity guard
        run: cd app && npm run check:breathing-worklets

      - name: Performance test suite
        run: cd app && npm run test:performance -- --ci --testTimeout=30000

  # T17 (TEST-10): Deno-based tests for Supabase Edge Functions. Closes
  # the audit's largest unprotected security surface — webhook JWS chain
  # validation, Google OIDC verification, replay protection, and
  # constant-time auth comparison. Runs independently of the Node suite
  # (different runtime). Required for ci-pass.
  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deno doesn't share Node's npm cache, so this job never depended on the
    # (now-removed) `prepare` job. It is the fastest gate in the workflow (~6s)
    # and was the standing proof that the Node jobs did not need `prepare`
    # either — it always started at t+3s while they waited until t+36s.
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Edge Functions test suite
        # INFRA-354: this gate used to resolve https://esm.sh/jose@5.9.6 and the
        # deno.land/std imports over the network at test time, so an esm.sh blip
        # (HTTP 522) reddened `CI pass` and blocked the merge of ANY PR in the repo —
        # it fired twice in ~20 minutes on 2026-08-06 against PRs touching zero edge
        # functions. Dependencies are now committed under supabase/functions/vendor/
        # and `deno task test` carries --cached-only, so the gate cannot reach the
        # network and fails closed on a new unvendored import instead of flaking.
        #
        # NOTE a lockfile alone does NOT fix this: `deno.lock` records integrity
        # hashes, it never populates the module cache. Measured on a cold DENO_DIR,
        # lock + --frozen still downloaded 74 files. The vendor tree is what removes
        # the fetch. Likewise --no-remote does NOT work here: vendoring maps remote
        # specifiers to local files but they stay remote specifiers, so --no-remote
        # rejects them and breaks the suite. --cached-only is the correct flag.
        #
        # DENO_DIR is pointed at an empty per-run path deliberately (no actions/cache):
        # a warm cache would hide a regression where a dependency stops being vendored.
        env:
          DENO_DIR: ${{ runner.temp }}/deno-cold
        run: cd supabase/functions && deno task test

  # Aggregate gate. Required jobs must pass; perf and lint can be
  # advisory if needed. Keeps PR review surface tight.
  ci-pass:
    name: CI pass
    runs-on: ubuntu-latest
    if: always()
    needs:
      - typecheck
      - lint
      - crisis-validation
      - clinical-validation
      - test
      - security
      - accessibility
      - performance
      - edge-functions

    steps:
      - name: Aggregate gate status
        run: |
          echo "typecheck:        ${{ needs.typecheck.result }}"
          echo "lint:             ${{ needs.lint.result }}"
          echo "crisis:           ${{ needs.crisis-validation.result }}"
          echo "clinical:         ${{ needs.clinical-validation.result }}"
          echo "test:             ${{ needs.test.result }}"
          echo "security:         ${{ needs.security.result }}"
          echo "performance:      ${{ needs.performance.result }}"
          echo "accessibility:    ${{ needs.accessibility.result }}"
          echo "edge-functions:   ${{ needs.edge-functions.result }}"
          # All 9 jobs are strict gates after T17 (TEST-10) added the
          # Edge Functions Deno suite.
          # Advisory list: (empty)
          #
          # Real gates that must pass:
          #   typecheck, lint (baseline ratchet), crisis-validation,
          #   clinical-validation, security, test, performance, accessibility,
          #   edge-functions
          if [[ "${{ needs.typecheck.result }}" != "success" \
             || "${{ needs.lint.result }}" != "success" \
             || "${{ needs.crisis-validation.result }}" != "success" \
             || "${{ needs.clinical-validation.result }}" != "success" \
             || "${{ needs.security.result }}" != "success" \
             || "${{ needs.test.result }}" != "success" \
             || "${{ needs.performance.result }}" != "success" \
             || "${{ needs.accessibility.result }}" != "success" \
             || "${{ needs.edge-functions.result }}" != "success" ]]; then
            echo "❌ One or more required gates failed"
            exit 1
          fi
          echo "✅ All required gates passed (advisory jobs may show non-success — see logs)"
