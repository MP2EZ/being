name: Release - iOS TestFlight

# Triggered when development → main release PRs merge (per INFRA-145 GitHub
# Flow). Produces a TestFlight build via EAS and chains submission server-side
# using --auto-submit, so this workflow exits in <2 min while EAS does the
# heavy lifting asynchronously.
#
# workflow_dispatch lets you manually re-run a release (without retagging) if
# a transient EAS or App Store Connect error needs a retry, or validate the
# pipeline with dry_run=true (auth + pre-flight only — no build, no TestFlight).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate auth + pre-flight without building (no TestFlight)'
        type: boolean
        default: false

env:
  NODE_VERSION: '24'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: read

# Never cancel a release mid-flight. If a hotfix lands on main while a build
# is queued on EAS, both should proceed; cancelling would orphan the in-flight
# build on EAS with no submission step ever queued.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: EAS build + auto-submit to TestFlight
    runs-on: ubuntu-latest
    # Waits for the build (see the --no-wait note below), so this must cover
    # EAS queue + build + submit. Observed build alone is ~7 min; queue is the
    # variable. 15 min was the old budget for a fire-and-forget exit.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: cd app && npm ci --prefer-offline --no-audit

      # Pre-flight safety net: MAINT-161 reconciled the real ascAppId +
      # appleTeamId into app/eas.json (submit.production.ios / submit.preview.ios,
      # bundle fyi.being.app). This guard catches any future regression that
      # reintroduces a PLACEHOLDER_ literal before it burns ~20 min of build
      # time on a submission EAS would reject. Fail fast instead.
      - name: Pre-flight - reject placeholder credentials in eas.json
        run: |
          if grep -q 'PLACEHOLDER_' app/eas.json; then
            echo "::error::app/eas.json submit.*.ios contains PLACEHOLDER_ credentials. Restore the real ascAppId / appleTeamId (MAINT-161) before releasing."
            exit 1
          fi

      # eas-version is PINNED, not `latest` (INFRA-345). The eas-cli flag surface
      # is consumed at exactly one place — the `eas build` step below — and that
      # step is gated `if: ${{ !inputs.dry_run }}`, so a dry run cannot exercise
      # it. An unpinned CLI therefore makes the one command we cannot test a
      # moving target. The `--submit-profile` incident documented on that step is
      # what this costs when it goes wrong: broken on every real release from
      # INFRA-146 until DEBUG-336, invisible to every dry run in between.
      #
      # BUMP PROTOCOL: change this deliberately, in its own commit, and expect
      # validation only from the NEXT REAL RELEASE reaching TestFlight — never
      # from a dry run. Do not bundle a bump with any other release-path change,
      # or a failure is unattributable between them.
      #
      # LOCKSTEP (INFRA-351): this pin and `app/eas.json`'s `cli.version` FLOOR are
      # one value in two files. Bumping this alone fails
      # `app/__tests__/scripts/eas-cli-version-lockstep.test.js` (CI, "Script guard
      # tests"), which asserts floor == pin exactly — not merely "pin satisfies
      # range", because `>=21.0.0 <22.0.0` would permit a 21.0.0-local vs
      # 21.6.0-CI skew, the divergence INFRA-351 existed to close. So a bump is:
      #   1. `npm i -g eas-cli@<new>` locally, `eas --version` to confirm — FIRST.
      #      The bound is ENFORCEABLE, not advisory: eas-cli THROWS when its own
      #      version misses `cli.version`, so a floor ahead of your global CLI
      #      breaks `npm run e2e:safety:build:eas` and any ad-hoc local `eas`.
      #      (`EAS_SKIP_CLI_VERSION_CHECK=1` is the deliberate escape hatch.)
      #   2. this pin + eas.json's floor + its `<major+1>` ceiling, together.
      # That pairing is NOT the "other release-path change" the paragraph above
      # forbids bundling — it is one logical change that happens to span two files.
      # The rationale cannot live in eas.json itself: it is strict-JSON-parsed at
      # module scope by `__tests__/safety/e2eSeedGate.config.test.ts` (in
      # `precommit`) and validated by `@expo/eas-json` with `allowUnknown: false`,
      # so neither a `//` line nor a `"//"` key survives.
      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: 21.6.0
          token: ${{ secrets.EXPO_TOKEN }}

      # Proves EXPO_TOKEN resolves to the expected account before any build.
      # On a dry_run dispatch this is the terminal check — green here means the
      # auth + pre-flight plumbing works end-to-end without producing a build.
      - name: Verify EAS auth (eas whoami)
        run: cd app && eas whoami

      # --auto-submit chains submission server-side on EAS once the build
      # finishes. It picks the submit profile whose name matches the *build*
      # profile, so --profile production selects submit.production in
      # eas.json. There is deliberately no submit-profile flag here: eas build
      # accepts only --auto-submit / --auto-submit-with-profile, and the
      # invented --submit-profile failed every real release from INFRA-146
      # until DEBUG-336 (dry runs skip this step, so it went unnoticed).
      # This step deliberately does NOT pass --no-wait. It used to, and that
      # made a red build report green: `eas build --no-wait` exits 0 the moment
      # EAS *accepts* the job, so the workflow's conclusion described the
      # scheduling, not the build. v1.2.0 errored in `Install dependencies` on
      # an expired GITHUB_TOKEN while this job reported success, and nothing on
      # GitHub ever went red. Waiting costs wall-clock and buys a real verdict.
      #
      # What waiting still does NOT cover: Apple's own processing of the
      # uploaded binary. That is asynchronous and reported only by email / App
      # Store Connect — a successful upload is not an accepted build. ITMS-90683
      # rejected v1.2.0 minutes after a fully green submit. See the final step.
      # Skipped on a workflow_dispatch with dry_run=true (validation only).
      - name: Build + auto-submit to TestFlight
        if: ${{ !inputs.dry_run }}
        run: |
          cd app
          eas build \
            --platform ios \
            --profile production \
            --auto-submit \
            --non-interactive

      # A green job above means the binary built and uploaded. It does NOT mean
      # the build is in TestFlight — Apple can still reject it during
      # processing, and only tells you by email.
      - name: Report what green does and does not mean
        if: ${{ !inputs.dry_run && success() }}
        run: |
          echo "Build succeeded and the binary was uploaded to App Store Connect."
          echo "This is NOT yet a TestFlight build: Apple processing can still reject it"
          echo "(e.g. ITMS-90683), and reports only by email / App Store Connect."
          echo "Verify: https://appstoreconnect.apple.com/apps/6777579207/testflight/ios"
