# SUPABASE PROJECT CONFIGURATION
# Being MBCT App - Subscription Management
#
# Supabase CLI v2 schema. Project ref is passed via --project-ref on link
# (no [project] section needed). Per-function blocks define verify_jwt;
# the bare [functions] section is no longer required.

# DATABASE CONFIGURATION
[db]
port = 54322
major_version = 17

# API CONFIGURATION
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# EDGE FUNCTIONS CONFIGURATION
# Per-function verify_jwt settings below. v2 dropped the umbrella
# `[functions] enabled = true` toggle.

# Verify Apple Receipt Function
# User-initiated from the mobile app during a purchase flow. Requires the
# user's Supabase JWT so the verified receipt can be tied to auth.uid().
# The function itself talks to Apple's receipt-verification endpoint with
# the shared secret -- the JWT gate is for caller identity, not Apple auth.
[functions.verify-apple-receipt]
verify_jwt = true

# Verify Google Receipt Function
# Same pattern as Apple -- user-initiated, must tie receipt to auth.uid().
[functions.verify-google-receipt]
verify_jwt = true

# Account Deletion (data-subject erasure, INFRA-260 PR3)
# User-initiated; the gateway-verified JWT scopes deletion to the caller's own
# auth.uid(). MUST stay true — a forged sub would let any caller delete any account.
[functions.delete-account]
verify_jwt = true

# Subscription Webhook Handler
# Apple/Google call this directly; they don't carry a Supabase JWT. The
# function verifies their own signatures (Apple JWS via verifyAppleJWS.ts,
# Google Pub/Sub OIDC via verifyGoogleOIDC.ts) before mutating state.
[functions.subscription-webhook]
verify_jwt = false

# Grace Period Automation (Cron Job)
# verify_jwt=false is REQUIRED: pg_cron -> net.http_post carries no user JWT. The
# X-Cron-Secret constant-time check inside index.ts is the sole compensating control.
# Scheduled via 20260616000000_grace_period_automation_cron.sql (INFRA-266). Uses its OWN
# Vault secret (grace_period_cron_secret) — a trust domain DISTINCT from the crisis alerter.
[functions.grace-period-automation]
verify_jwt = false

# Crisis-Detection Alerting (INFRA-219, Cron Job)
# verify_jwt=false is REQUIRED: pg_cron -> net.http_post carries no user JWT. The
# X-Cron-Secret constant-time check inside index.ts is the sole compensating control.
[functions.crisis-detection-alerting]
verify_jwt = false

# Crisis-Detection Synthetic Liveness Probe (INFRA-265, Cron Job)
# Same posture as the alerter: pg_cron -> net.http_post carries no user JWT, so
# verify_jwt=false and the X-Cron-Secret constant-time check inside index.ts is the sole
# compensating control. Shares CRON_SECRET with crisis-detection-alerting (same
# crisis-monitoring trust domain). Writes a synthetic marker to crisis_liveness_probe only.
[functions.crisis-liveness-probe]
verify_jwt = false

# CRON JOB CONFIGURATION
#
# RESOLVED (INFRA-266): grace-period-automation is scheduled via the pg_cron migration
# 20260616000000_grace_period_automation_cron.sql (path 1 below) — CLI v2 dropped the inline
# [[functions.X.schedule]] block, so the cron now lives in a migration, not this file.
#   job name : 'grace-period-automation'
#   schedule : '0 2 * * *'   (daily 2:00 AM UTC — the original intent)
#   payload  : { "source": "pg_cron" }
#   command  : net.http_post to the Vault `grace_period_function_url`, with the
#              X-Cron-Secret header read from the Vault `grace_period_cron_secret`
#              (a secret DISTINCT from the crisis alerter's). Bootstrap both Vault
#              secrets + the edge CRON_SECRET out of band (see the migration header).
# A heartbeat row lands in public.grace_period_automation_runs per run (observability).

# AUTH CONFIGURATION
[auth]
enabled = true
site_url = "exp://localhost:8081"  # Expo development URL
additional_redirect_urls = ["exp://being.app"]
# INFRA-260: the app's identity is a Supabase anonymous session (signInAnonymously).
# This MUST be enabled for auth.uid() to be non-null and for RLS to enforce isolation.
# config.toml governs the LOCAL stack; the shared project (yliycxslzdsgjtpxggtf) also
# needs Anonymous Sign-Ins toggled ON in the dashboard (Authentication → Providers).
enable_anonymous_sign_ins = true

# Email signup stays disabled — no email/password accounts (no PII).
[auth.email]
enable_signup = false

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"

# STORAGE CONFIGURATION
[storage]
enabled = true
file_size_limit = "10MB"  # Encrypted backup limit

# REALTIME CONFIGURATION
[realtime]
enabled = false  # Not needed for this app

# ENVIRONMENT VARIABLES
# Note: Set these in Supabase dashboard or via CLI
# Required for Apple receipt verification:
# - APPLE_SHARED_SECRET
#
# Required for Google receipt verification:
# - GOOGLE_SERVICE_ACCOUNT (JSON string)
#
# Required for cron job:
# - CRON_SECRET
#
# Optional for crisis-detection-alerting external dead-man's-switch (INFRA-264):
# - CRISIS_HEALTHCHECK_PING_URL  (capability URL, e.g. https://hc-ping.com/<uuid> — secret;
#   set by name only, never committed. Unset = external switch not provisioned.)
#
# Optional for grace-period-automation external dead-man's-switch (INFRA-296):
# - SUBSCRIPTION_HEALTHCHECK_PING_URL  (capability URL — secret; set by name only, never
#   committed. Unset = external switch not provisioned.)
#   MUST be a DIFFERENT healthchecks.io check from CRISIS_HEALTHCHECK_PING_URL above. The
#   two trust domains page and rotate independently; pointing both names at one check
#   would let an ops-side rotation silently break crisis paging. Nothing mechanical can
#   verify this — the static pin forbids both URLs identically — so it is console
#   discipline. See docs/development/post-launch-monitoring-runbook.md §3.
#
# Required for all functions:
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
