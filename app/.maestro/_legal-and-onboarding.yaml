appId: fyi.being.app
tags:
  - helper
name: "Helper: traverse LegalGate + Onboarding"
---
# Reusable subflow. Called via `- runFlow: _legal-and-onboarding.yaml`
# from each top-level safety flow after a fresh
# launchApp { clearState: true, clearKeychain: true }.
#
# Goal: get the app from the cold-start LegalGate to the main tab navigator
# as fast as possible, without driving any safety surface.
#
# This subflow exists because the LegalGate (age picker + 4 consent toggles)
# and Onboarding (5 sub-screens) are non-safety UI ceremony that would
# otherwise dominate flow runtime and brittleness. Safety surfaces (crisis
# detection, threshold alerts, 988 dial) are tested by the calling flows.
#
# INFRA-181: the prior dev-menu tutorial dismiss step (tapOn text "Continue"
# optional) was non-deterministic — sometimes opening a secondary dev-tools
# panel that bounced the app back to the Expo dev launcher. App.tsx now
# calls DevMenu.closeMenu() on mount when EXPO_PUBLIC_E2E_SUPPRESS_DEV_MENU=1
# (set in .env.development), so the tutorial is dismissed JS-side before
# Maestro polls the view hierarchy. No flow-level dismiss needed.

# ── Step 0: Expo dev launcher → load Being app ──────────────────
# In dev builds, launchApp lands in the Expo dev-client launcher with a
# "DEVELOPMENT SERVERS" list. Tap the Metro server entry to load the
# JS bundle. In release builds these steps are no-ops (optional: true).
# Dismiss any "Open in 'Being'?" system prompt first.
- tapOn:
    text: "Open"
    optional: true
# Wait briefly for the dev launcher to populate its server list.
- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 15000
    optional: true
# Tap the Metro server row by location (50% x, ~20% y) since text-based
# selectors on the dev launcher are unreliable. The row is fixed in the
# layout — first item under DEVELOPMENT SERVERS header.
- tapOn:
    point: "50%, 20%"
    optional: true
# LegalGate readiness signal. Use the testID added in INFRA-179
# (legal-dob-picker on CombinedLegalGateScreen.tsx:247) — testID is more
# deterministic than text and survives copy drift. App.tsx's dev-menu
# suppression (INFRA-181) runs before Maestro reaches this poll, so no
# tutorial-dismiss step is needed.
- extendedWaitUntil:
    visible:
      id: "legal-dob-picker"
    timeout: 30000

# ── Step 1: LegalGate — date-of-birth picker (INFRA-179, INFRA-181, INFRA-656) ─
# @react-native-picker/picker renders an inline UIPickerView, opaque to the accessibility
# tree (one anonymous child, no row nodes), so swiping is the only option. Years descend
# from the current year with a null placeholder at index 0 (CombinedLegalGateScreen.tsx).
#
# THE ANCHOR IS THE TECHNIQUE — measured in `legal-gate-art9-optional.yaml`. Only
# `swipe: from: { id: legal-dob-picker }` turns the wheel: a fixed-coordinate swipe with
# both endpoints inside the picker scrolls the PAGE, and a point tap on a row does nothing.
# The `tapOn: legal-dob-picker` that used to precede these swipes was therefore never a
# focus step, just an unguarded touch-down at a point that moves with Dynamic Type, and
# INFRA-656 removed it.
#
# ORIGIN CLEARANCE. Each swipe starts at the picker's centre. The helper text directly
# BELOW the picker is asserted above the pinned footer's title first, so the picker ends
# above that text and its centre is at least half the picker's height clear of the footer,
# on any viewport. Picker swipes do not move the page (measured), and a gesture the page
# steals carries content UP, away from the footer.
#
# THREE SWIPES, EACH SETTLED. Back-to-back, the wheel's deceleration drops the picker node
# from the hierarchy (measured: the fifth of five failed "Element not found" against a
# picker on screen). Each swipe advanced ten years at 375x667 (2017, 2007, 1997), so three
# land ~29 years back — adult with an ~11-year margin, and far from the 100-entry list's
# floor. An element-anchored UP swipe ends at 10% of screen height, so on a taller device
# it is somewhat shorter and the margin smaller. Unmeasured on hardware: an under-18 year
# routes to the under-age screen, where the first consent step below fails loudly on a
# missing id, never silently.
- assertVisible:
    text: "We use your age only.*"
    above:
      text: "Need support now.*"
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- waitForAnimationToEnd
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- waitForAnimationToEnd
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- waitForAnimationToEnd
# Paired guard (INFRA-494). `assertNotVisible: "Select year..."` ALONE IS A FALSE GUARD:
# the placeholder also vanishes when the page steals the swipes and carries the picker
# off the top of the screen. Asserting the picker is still there FIRST discriminates,
# because XCUITest drops what leaves the screen. The year assertion is the direct read:
# iOS publishes the wheel's selected value as a `text` node.
- assertVisible:
    id: "legal-dob-picker"
- assertNotVisible:
    text: "Select year..."
- assertVisible:
    text: "[0-9]{4}"

# ── Step 1b: four consent checkboxes, every tap GUARDED against the crisis footer ────
# INFRA-656 (crisis review). This helper runs only on physical iPhones, where
# `canOpenURL('tel:')` is TRUE: a tap on `legal-gate-crisis-988` raises the system call
# prompt for the live 988 line, and one on `legal-gate-crisis-text` opens Messages to
# 741741. A mis-tap here is a harm to PREVENT, not a failure to detect, and it has to be
# prevented by derivation because no Maestro can run this file (DEBUG-589).
#
# testIDs sit on the 24pt indicator View, not the outer Pressable (INFRA-181): the
# Pressable's centre falls in the label, whose inline `Linking.openURL` link would take the
# tap. The indicator's centre is x ~60, INSIDE the 988 button's x 50..180, so only the
# y axis can keep a tap clear, and on an unknown viewport y is unknown.
#
# THE GUARD, and why it holds on any viewport and at any Dynamic Type size:
#   D0  LegalGate is in RootCrisisButton's SUPPRESSED_ROUTES, so the footer's two buttons
#       are the only crisis controls on this screen.
#   D1  `above: X` keeps a candidate only if its TOP edge is strictly above X's top edge
#       (Maestro 2.6.0 `Filters.above`). No anchor, or not above it: nothing matches and
#       the `optional` tap never fires. The guard fails SAFE.
#   D2  `point:` with a selector taps the SAME element the guard matched
#       (Orchestra.tapOnElement → calculateElementRelativePoint). Without it,
#       `Maestro.tap(UiElement)` settles, RE-RESOLVES the element through
#       `ViewHierarchy.refreshElement` and taps bounds the guard never checked.
#       `point:` is load-bearing, not styling.
#   D3  The indicator is a fixed 24pt box, so a guarded tap lands at most 11pt below the
#       footer title's top.
#   D4  The footer is a column — the title, then the button row (988 first, wrapping
#       downward) — so every crisis control's top is at least title top + title height + 8.
#       A guarded tap therefore stays above every crisis control whenever the title has any
#       height, at every viewport and type size.
#   D5  The footer is a flex sibling OUTSIDE the ScrollView, so the anchor cannot move with
#       the content between the match and the tap.
# Never anchor `above:` on `legal-gate-crisis-988` itself: top-vs-top would admit a box
# whose top is 1pt above the button's and put the tap ~11pt INSIDE it.
#
# POSITIONING is a separate concern: it only decides whether a tap lands ON the box or
# harmlessly on the footer's padding. Each box is taken to its LANDING position (the element
# structurally below it is above the footer title, so the whole box is inside the ScrollView)
# by slow drags whose touch-down is itself a guarded, NON-interactive text node — a prompt or
# a heading, never a checkbox and never the picker. No touch-down is a screen percentage, and
# no scroll-percentage window is used (art9's 22..57% is a 375x667 constant). A box that
# cannot be landed fails loudly at its landing assertion, before any tap. `waitForAnimationToEnd`
# precedes every guarded tap: a rubber-band bounce moves content DOWN, toward the footer.
#
# THE ORACLE (INFRA-494, unchanged). Each `-check` testID renders only while its own consent
# is true, and `legalGateE2eOracle.safety.test.tsx` pins that it tracks state both ways, so a
# retry cannot silently untick a box. It proves a touch reached the RIGHT Pressable. It says
# nothing about where a missed touch went: that is the guard's job, and `times: 3` is a cap
# on attempts, never to be raised.
#
# PROVEN vs ASSUMED
#   proven   D1, D2 — the pinned Maestro 2.6.0 bytecode (app/package.json
#            `maestro.pinnedVersion`, enforced fail-closed by e2e-safety.sh)
#   proven   D0, D3, D4, D5 and every text anchor below — pinned in CI by
#            legalGateE2eOracle.safety.test.tsx and crisis-zero-988-windows.test.tsx
#   proven   that the guard discriminates on the real screen: legal-gate-art9-optional.yaml
#            asserts it EXCLUDES the box behind the footer and ADMITS the one above it
#   assumed  that the drags land each box — liveness only, unmeasured at accessibility sizes
#            and on any physical device; a miss reds at the landing assertion
# RESIDUAL. Moving `maestro.pinnedVersion` invalidates D1 and D2, which must be re-derived.
# LegalGate leaving SUPPRESSED_ROUTES invalidates D0: the FAB would be a third crisis
# control this guard does not bound.

# Reveal ToS if it is not yet above the footer title. Touch-down: the "What year were you
# born?" prompt, which precedes the picker, so it is wholly inside the ScrollView whenever
# the picker's top is above the title.
- runFlow:
    when:
      notVisible:
        id: "legal-consent-tos"
        above:
          text: "Need support now.*"
    commands:
      - swipe:
          from:
            text: "What year were you born.*"
            above:
              id: "legal-dob-picker"
              above:
                text: "Need support now.*"
          direction: UP
          duration: 1200
      - waitForAnimationToEnd
# Land the three required boxes. Touch-down: the "Required to continue" heading, which
# precedes the ToS row, so it is wholly inside the ScrollView whenever ToS's top is above
# the title. One slow drag carries the heading to ~10% of screen height and leaves all three
# required boxes in the band together. Skipped when the band already holds them.
- runFlow:
    when:
      notVisible:
        id: "legal-consent-mh-processing"
        above:
          text: "Need support now.*"
    commands:
      - swipe:
          from:
            text: "Required to continue"
            above:
              id: "legal-consent-tos"
              above:
                text: "Need support now.*"
          direction: UP
          duration: 1200
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-privacy"
    above:
      text: "Need support now.*"
- repeat:
    times: 3
    while:
      notVisible:
        id: "legal-consent-tos-check"
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: "legal-consent-tos"
          above:
            text: "Need support now.*"
          point: "50%, 50%"
          optional: true
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-tos-check"
- assertVisible:
    id: "legal-consent-wellness"
    above:
      text: "Need support now.*"
- repeat:
    times: 3
    while:
      notVisible:
        id: "legal-consent-privacy-check"
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: "legal-consent-privacy"
          above:
            text: "Need support now.*"
          point: "50%, 50%"
          optional: true
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-privacy-check"
- assertVisible:
    id: "legal-consent-mh-processing"
    above:
      text: "Need support now.*"
- repeat:
    times: 3
    while:
      notVisible:
        id: "legal-consent-wellness-check"
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: "legal-consent-wellness"
          above:
            text: "Need support now.*"
          point: "50%, 50%"
          optional: true
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-wellness-check"
# Land the Art. 9 box. Touch-down: the "Optional" heading, which precedes it. Unlike
# `legal-gate-art9-optional.yaml`, this helper DOES tick the Art. 9 box: its job is
# traversal, not FEAT-470's refusal contract.
- runFlow:
    when:
      notVisible:
        text: "This one is optional.*"
        above:
          text: "Need support now.*"
    commands:
      - swipe:
          from:
            text: "Optional"
            above:
              id: "legal-consent-mh-processing"
              above:
                text: "Need support now.*"
          direction: UP
          duration: 1200
      - waitForAnimationToEnd
- assertVisible:
    text: "This one is optional.*"
    above:
      text: "Need support now.*"
- repeat:
    times: 3
    while:
      notVisible:
        id: "legal-consent-mh-processing-check"
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: "legal-consent-mh-processing"
          above:
            text: "Need support now.*"
          point: "50%, 50%"
          optional: true
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-mh-processing-check"

# ── Continue: reach it by running the ScrollView into its CONTENT BOUNDARY ───────
# FIXED in INFRA-494 (crisis review C1-C6). This step used to be
# `scrollUntilVisible: { element: { id: legal-gate-continue } }` followed by `tapOn`,
# justified as "more durable than blind swipes". That reasoning was sound when INFRA-181
# wrote it on 2026-05-27, when the crisis footer was still the ScrollView's LAST CHILD,
# and DEBUG-390 broke it on 2026-08-12 by pinning the footer OUTSIDE the ScrollView.
# Nothing revisited the helper for 2.5 months.
#
# WHY THE OLD SHAPE WAS A 988 MIS-TAP. `legal-gate-continue` is inside the ScrollView
# (CombinedLegalGateScreen.tsx:594); the footer is a flex sibling after it (:638) and
# occupies the bottom ~114pt. XCUITest DROPS elements outside the SCREEN but KEEPS ones
# merely outside a ScrollView's CLIP, so a Continue hidden behind the footer reports 100%
# visible, `scrollUntilVisible` performs no scroll, and the tap lands on the footer's
# coordinates. Continue is full-width so its centre is x 187.5, which today falls in the
# 16pt gap between the two footer buttons — it misses `legal-gate-crisis-988` (x 50..180)
# by about half a point. At xxxLarge the footer's `flexWrap` row breaks, the buttons stack
# and centre, and the same tap point lands squarely on a crisis control.
#
# WHY THE REPLACEMENT IS SAFE ON A VIEWPORT THIS FLOW CANNOT MEASURE. Not "measured on a
# simulator and assumed to generalise" — derived. The footer is a flex SIBLING of a
# `flex: 1` ScrollView, a position pinned in CI by
# `__tests__/safety/crisis-zero-988-windows.test.tsx:131-146`, so the ScrollView's frame
# ENDS where the footer's begins and the two cannot intersect at any viewport or Dynamic
# Type setting — the footer growing shrinks the ScrollView rather than overlapping it. At
# the content clamp, content-bottom coincides with viewport-bottom, so Continue sits above
# it by `continueButton.marginBottom` (spacing[24]) + `scrollContent.paddingBottom`
# (spacing[32]). Even with both at zero its tap centre would still be >= 28pt
# (`minHeight: 56`) inside the ScrollView frame. A UIScrollView also CLAMPS at its content
# boundary, so extra flicks are no-ops and the count only has to be "enough", never
# "exact". No visibility measurement is involved anywhere, which is the whole point.
#
# The corridor is carried verbatim from `legal-gate-art9-optional.yaml`, with its reason:
# 65%→25% keeps both endpoints inside the ScrollView even at xxxLarge, where the footer
# grows from ~114pt (top at 82.9% of a 667pt screen) to ~162pt (top at ~75.7%). A corridor
# starting at 72% would eventually begin ON the footer and every swipe would be a no-op.
# Recorded limit (INFRA-656, crisis review): beyond xxxLarge, at AX4/AX5 on a 667pt screen,
# the 65% start is ESTIMATED to land on the footer — possibly on `legal-gate-crisis-988`.
# That stays safe for a different reason, not by clearance: a 40%-of-screen flick releases
# far outside a Pressable's retention rect, so no onPress fires. The flick is a no-op and
# the `100%` assertion below reds. It is the one screen-percentage touch-down left in this
# helper, kept because the clamp needs a flick and no element is guaranteed low enough.
#
# HONEST LIMIT, stated rather than implied. The technique is proven end-to-end on the
# SIMULATOR at 375x667 by `legal-gate-art9-optional.yaml`. This helper's own invocation is
# unproven and cannot be proven: all THREE of its callers are device-class —
# `crisis-988-dial.yaml` and `crisis-keyboard-accessory.yaml` (`safety-device-only`) and
# `breathing-fps-budget.yaml` (`perf-device-only`) — and DEBUG-589 established that no
# released Maestro can drive a physical iPhone, so `e2e-safety.sh` refuses the device path
# outright. Deferring the fix until it could be device-proven would have been an
# INDEFINITE deferral of a known 988 mis-tap, which is why it was not deferred again. The
# residual is the flick COUNT, and the `100%` assertion below converts that from a silent
# mis-tap into a loud, attributed failure.
#
# The two `Unable to (Call|Text)` guards below are SIMULATOR-ONLY attribution, and bound
# nothing on the devices this helper actually runs on (corrected INFRA-656). On the
# simulator `canOpenURL('tel:')` is unconditionally false (INFRA-184), so a stray footer tap
# raises the modal manual-dial Alert and these lines name it instead of letting it surface
# ~90s later as "Home never appeared". On a physical iPhone `canOpenURL` is TRUE: a stray
# tap raises the system call prompt (988) or opens Messages (741741), and neither line can
# match either. Prevention is the consent-tap guard above and the Continue clamp below.
#
# HONEST LIMIT on those two lines specifically: they are UNVERIFIED against a live Alert —
# proving they can fire would mean deliberately tapping a 988 control, which no flow may
# do. They must not be read as evidence that a mis-tap WOULD be caught. If a future run
# ever does surface the fallback Alert, confirm the regex actually matched it first.
- assertNotVisible:
    text: ".*Unable to (Call|Text).*"
- swipe:
    start: "50%, 65%"
    end: "50%, 25%"
- swipe:
    start: "50%, 65%"
    end: "50%, 25%"
- swipe:
    start: "50%, 65%"
    end: "50%, 25%"
- waitForAnimationToEnd
# PROVE the clamp was reached before tapping (crisis review C1). Three flicks is a
# measured 375x667 constant and this helper runs on unknown device viewports; at an
# INTERMEDIATE offset Continue can sit inside the footer band, be reported by XCUITest,
# and be tapped — which is precisely the defect being replaced. iOS publishes the vertical
# scroll indicator as a node whose text is the offset as a percentage of scrollable range,
# so this reads scroll POSITION directly rather than inferring it from visibility. Matched
# as exactly "100%": a 99% reading is evidence the flick count has gone short, not noise.
- assertVisible:
    text: "100%"
- tapOn:
    id: "legal-gate-continue"
- assertNotVisible:
    text: ".*Unable to (Call|Text).*"

# ── Step 2: Onboarding ────────────────────────────────────────────
# Onboarding sequence (per OnboardingScreen.navigateNext + CleanRootNavigator
# AssessmentFlow stack screen):
#   1. Welcome           → "Begin Your Practice"  → opens PHQ-9 modal
#   2. PHQ-9 (9 q's, Q1 direct — no intro in onboarding context)
#   3. GAD-7 (7 q's, Q1 direct — same)
#   4. Stoic Intro       → "Continue"
#   5. Notifications     → "Continue" (or "Set up later" — both navigateNext)
#   6. Privacy           → "Continue"
#   7. Celebration       → "Explore App" (testID="onboarding-explore-app")
#
# INFRA-183: AssessmentFlow modal jumps STRAIGHT to Q1 in onboarding context
# — CleanRootNavigator.tsx sets `showIntroduction={route.params.context ===
# 'standalone'}`, so onboarding suppresses the intro screen (and its
# Skip-for-Now button). The only way through is to answer all 16 questions.
# Each tap fires onAnswer → setCurrentQuestionIndex(prev + 1) auto-advance
# (EnhancedAssessmentFlow.tsx:284-285), so no Next/Continue button between
# questions. Tap option-0 ("Not at all" / "Never") to keep all scores at 0
# and avoid any crisis-threshold side effects.
- tapOn:
    text: "Begin Your Practice"
    optional: true

# PHQ-9 — 9 questions, "Not at all" (option-0) each.
#
# INFRA-208: the prior blind `repeat: { times: 9 }` fired 9 taps with NO
# settle between them. Each tap auto-advances (onAnswer →
# setCurrentQuestionIndex(prev+1), EnhancedAssessmentFlow.tsx:284-285); on a
# slower/loaded sim a tap landed mid-transition (before the next question's
# radio mounted) and was dropped, leaving the assessment short so onboarding
# never reached Stoic Intro — the non-deterministic Phase 2.5 gate failure.
#
# Fix: unroll the loop and wait for each question's progress counter before
# tapping, so the prior auto-advance has settled (radio mounted) first. The
# counter is a single text node — "Question {currentStep} of {totalSteps}"
# (EnhancedAssessmentQuestion.tsx:313-318) — so it's a reliable per-question
# settle signal that adapts to sim speed (no fixed sleeps). A static `repeat`
# can't express this because the post-condition changes every iteration.
# Each `timeout` is a failure ceiling only — the wait returns the instant the
# counter is visible, so the assessment section stays well within ≤45s.
# NOTE: Maestro's `text:` is a FULL-MATCH regex, and RN merges this counter's
# Text with the sibling progress-bar accessibilityLabel into one node whose
# accessibility string is "Question N of M, Progress: N of M questions
# completed" (verified via `maestro hierarchy`, INFRA-208). A bare
# "Question N of M" therefore does NOT match — wrap in `.*…*` to full-match
# the merged string.
- extendedWaitUntil:
    visible:
      text: ".*Question 1 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 2 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 3 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 4 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 5 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 6 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 7 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 8 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 9 of 9.*"
    timeout: 10000
# Answers PHQ-9 Q9 → onComplete dismisses the modal → a 50ms setTimeout
# (OnboardingScreen.tsx:824) launches GAD-7. The next wait below bridges that
# gap (and the brief `completing` ActivityIndicator) deterministically:
# "Question 1 of 7" can't appear until GAD-7 Q1 has mounted.
- tapOn:
    id: "assessment-response-group-option-0"

# GAD-7 — 7 questions, same wait-then-tap pattern. After Q7 → Stoic Intro.
- extendedWaitUntil:
    visible:
      text: ".*Question 1 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 2 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 3 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 4 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 5 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 6 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 7 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"

# Stoic Intro → Notifications → Privacy: each has a "Continue" CTA at the
# bottom of a scrollable section that may be below the fold (5-principle
# list on Stoic Intro is the tallest). scrollUntilVisible is a no-op when
# the element is already in viewport, so safe to apply uniformly.
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn:
    text: "Continue"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn:
    text: "Continue"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn:
    text: "Continue"

# Final screen — Explore App routes to Main tabs.
- tapOn:
    id: "onboarding-explore-app"

# ── Step 3: Verify we landed on Main ─────────────────────────────
# Use testID rather than text: the bottom Home tab label is rendered with
# accessibilityText "Home, tab, 1 of 4" (per iOS Tab Bar conventions) and
# Maestro's `text:` selector doesn't match against accessibilityText. The
