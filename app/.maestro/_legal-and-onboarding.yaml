appId: fyi.being.app
tags:
  - helper
name: "Helper: traverse LegalGate + Onboarding"
---
# Reusable subflow. Called via `- runFlow: _legal-and-onboarding.yaml`
# from each top-level safety flow after a fresh
# launchApp { clearState: true, clearKeychain: true }.
#
# Goal: get the app from the cold-start LegalGate to the main tab navigator
# as fast as possible, without driving any safety surface.
#
# This subflow exists because the LegalGate (age picker + 4 consent toggles)
# and Onboarding (5 sub-screens) are non-safety UI ceremony that would
# otherwise dominate flow runtime and brittleness. Safety surfaces (crisis
# detection, threshold alerts, 988 dial) are tested by the calling flows.
#
# INFRA-181: the prior dev-menu tutorial dismiss step (tapOn text "Continue"
# optional) was non-deterministic — sometimes opening a secondary dev-tools
# panel that bounced the app back to the Expo dev launcher. App.tsx now
# calls DevMenu.closeMenu() on mount when EXPO_PUBLIC_E2E_SUPPRESS_DEV_MENU=1
# (set in .env.development), so the tutorial is dismissed JS-side before
# Maestro polls the view hierarchy. No flow-level dismiss needed.

# ── Step 0: Expo dev launcher → load Being app ──────────────────
# In dev builds, launchApp lands in the Expo dev-client launcher with a
# "DEVELOPMENT SERVERS" list. Tap the Metro server entry to load the
# JS bundle. In release builds these steps are no-ops (optional: true).
# Dismiss any "Open in 'Being'?" system prompt first.
- tapOn:
    text: "Open"
    optional: true
# Wait briefly for the dev launcher to populate its server list.
- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 15000
    optional: true
# Tap the Metro server row by location (50% x, ~20% y) since text-based
# selectors on the dev launcher are unreliable. The row is fixed in the
# layout — first item under DEVELOPMENT SERVERS header.
- tapOn:
    point: "50%, 20%"
    optional: true
# LegalGate readiness signal. Use the testID added in INFRA-179
# (legal-dob-picker on CombinedLegalGateScreen.tsx:247) — testID is more
# deterministic than text and survives copy drift. App.tsx's dev-menu
# suppression (INFRA-181) runs before Maestro reaches this poll, so no
# tutorial-dismiss step is needed.
- extendedWaitUntil:
    visible:
      id: "legal-dob-picker"
    timeout: 30000

# ── Step 1: LegalGate — date-of-birth picker (INFRA-179, INFRA-181) ─
# @react-native-picker/picker renders inline UIPickerView on iOS. Wheel
# items aren't tappable as text in the accessibility tree, so swiping is
# the only option. Years are sorted descending (newest first) — see
# CombinedLegalGateScreen.tsx:69 `currentYear - i`. Placeholder (value=null)
# at index 0. The specific year doesn't matter as long as it's ≥18.
#
# INFRA-181: swipe coords must START AND END INSIDE the picker's y-range
# (currently ~25%–48% of screen height — see bounds in hierarchy dump).
# Earlier coords started at 70% (below the picker) so the parent ScrollView
# claimed the gesture and the wheel never scrolled. Use the picker's id as
# the swipe anchor so coords don't drift with layout changes.
- tapOn:
    id: "legal-dob-picker"
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
# Regression guard: fail fast if the wheel didn't actually scroll
# (placeholder still visible = no year selected, Continue would stay
# disabled and the downstream `assertVisible: text "Home"` failure
# would take ~90s to surface).
#
# INFRA-494: `assertNotVisible: "Select year..."` ALONE IS A FALSE GUARD, and it
# passes in the failure case it was written to catch. The placeholder disappears
# for two different reasons: the wheel turned (what we want), or the parent
# ScrollView claimed the swipes and carried the picker off the top of the screen
# with the placeholder still selected (what we fear). Both leave the placeholder
# unmatched, so the guard greens either way.
#
# Pairing it with `assertVisible: legal-dob-picker` discriminates, and does so in
# the direction that can actually occur here: these swipes scroll the content UP,
# so a stolen gesture carries the picker past the TOP of the screen, and XCUITest
# DROPS elements outside the screen — the assert fails loudly. (It would NOT
# discriminate for content pushed below the fold: XCUITest keeps elements that are
# merely outside a ScrollView's clip but still on screen, which is the whole
# INFRA-494 finding. Ordering matters: assert the picker is still there BEFORE
# concluding anything from the placeholder's absence.)
- assertVisible:
    id: "legal-dob-picker"
- assertNotVisible:
    text: "Select year..."

# Four consent checkboxes via testID. testIDs sit on the 24px indicator View,
# NOT the outer Pressable (INFRA-181): the Pressable's bounding-box center
# falls in the text region, where the inline `Linking.openURL` link substring
# (e.g. "Terms of Service") would intercept the tap and navigate away.
# Tapping the small indicator forces the touch into a link-free zone — the
# parent Pressable still receives the event via RN tap propagation.
#
# INFRA-494 (crisis review C7) — each tap is now VERIFIED, not assumed. Each `-check`
# testID is on a glyph that renders only when its own consent state is true, so the id
# existing IS the tick; `legalGateE2eOracle.safety.test.tsx` pins that it tracks state in
# both directions, which is what makes a retry safe (a latching glyph would let a retry
# silently untick a consent and still green).
#
# This does NOT prevent a mis-tap, and must not be read as if it did — the checkbox
# indicator's centre is x ~60, inside the 988 button's x 50..180, so a tap that lands in
# the footer's y-band hits a crisis control squarely. What it does is BOUND one: the run
# now reds at the box that missed, with the `Unable to Call` guard right after it, instead
# of carrying a modal Alert forward into the Continue step. The positional fix — a
# viewport-agnostic way to land these four taps in a helper that runs on unknown device
# viewports — is deliberately NOT attempted here and is tracked separately; the clamp
# theorem used at Continue below does not transfer to mid-content elements.
- repeat:
    times: 3
    while:
      notVisible:
        id: "legal-consent-tos-check"
    commands:
      - tapOn:
          id: "legal-consent-tos"
          optional: true
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-tos-check"
- repeat:
    times: 3
    while:
      notVisible:
        id: "legal-consent-privacy-check"
    commands:
      - tapOn:
          id: "legal-consent-privacy"
          optional: true
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-privacy-check"
- repeat:
    times: 3
    while:
      notVisible:
        id: "legal-consent-wellness-check"
    commands:
      - tapOn:
          id: "legal-consent-wellness"
          optional: true
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-wellness-check"
# Unlike `legal-gate-art9-optional.yaml`, this helper DOES tick the Art. 9 box: its job is
# traversal, not FEAT-470's refusal contract.
- repeat:
    times: 3
    while:
      notVisible:
        id: "legal-consent-mh-processing-check"
    commands:
      - tapOn:
          id: "legal-consent-mh-processing"
          optional: true
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-mh-processing-check"

# ── Continue: reach it by running the ScrollView into its CONTENT BOUNDARY ───────
# FIXED in INFRA-494 (crisis review C1-C6). This step used to be
# `scrollUntilVisible: { element: { id: legal-gate-continue } }` followed by `tapOn`,
# justified as "more durable than blind swipes". That reasoning was sound when INFRA-181
# wrote it on 2026-05-27, when the crisis footer was still the ScrollView's LAST CHILD,
# and DEBUG-390 broke it on 2026-08-12 by pinning the footer OUTSIDE the ScrollView.
# Nothing revisited the helper for 2.5 months.
#
# WHY THE OLD SHAPE WAS A 988 MIS-TAP. `legal-gate-continue` is inside the ScrollView
# (CombinedLegalGateScreen.tsx:594); the footer is a flex sibling after it (:638) and
# occupies the bottom ~114pt. XCUITest DROPS elements outside the SCREEN but KEEPS ones
# merely outside a ScrollView's CLIP, so a Continue hidden behind the footer reports 100%
# visible, `scrollUntilVisible` performs no scroll, and the tap lands on the footer's
# coordinates. Continue is full-width so its centre is x 187.5, which today falls in the
# 16pt gap between the two footer buttons — it misses `legal-gate-crisis-988` (x 50..180)
# by about half a point. At xxxLarge the footer's `flexWrap` row breaks, the buttons stack
# and centre, and the same tap point lands squarely on a crisis control.
#
# WHY THE REPLACEMENT IS SAFE ON A VIEWPORT THIS FLOW CANNOT MEASURE. Not "measured on a
# simulator and assumed to generalise" — derived. The footer is a flex SIBLING of a
# `flex: 1` ScrollView, a position pinned in CI by
# `__tests__/safety/crisis-zero-988-windows.test.tsx:131-146`, so the ScrollView's frame
# ENDS where the footer's begins and the two cannot intersect at any viewport or Dynamic
# Type setting — the footer growing shrinks the ScrollView rather than overlapping it. At
# the content clamp, content-bottom coincides with viewport-bottom, so Continue sits above
# it by `continueButton.marginBottom` (spacing[24]) + `scrollContent.paddingBottom`
# (spacing[32]). Even with both at zero its tap centre would still be >= 28pt
# (`minHeight: 56`) inside the ScrollView frame. A UIScrollView also CLAMPS at its content
# boundary, so extra flicks are no-ops and the count only has to be "enough", never
# "exact". No visibility measurement is involved anywhere, which is the whole point.
#
# The corridor is carried verbatim from `legal-gate-art9-optional.yaml`, with its reason:
# 65%→25% keeps both endpoints inside the ScrollView even at xxxLarge, where the footer
# grows from ~114pt (top at 82.9% of a 667pt screen) to ~162pt (top at ~75.7%). A corridor
# starting at 72% would eventually begin ON the footer and every swipe would be a no-op.
#
# HONEST LIMIT, stated rather than implied. The technique is proven end-to-end on the
# SIMULATOR at 375x667 by `legal-gate-art9-optional.yaml`. This helper's own invocation is
# unproven and cannot be proven: all THREE of its callers are device-class —
# `crisis-988-dial.yaml` and `crisis-keyboard-accessory.yaml` (`safety-device-only`) and
# `breathing-fps-budget.yaml` (`perf-device-only`) — and DEBUG-589 established that no
# released Maestro can drive a physical iPhone, so `e2e-safety.sh` refuses the device path
# outright. Deferring the fix until it could be device-proven would have been an
# INDEFINITE deferral of a known 988 mis-tap, which is why it was not deferred again. The
# residual is the flick COUNT, and the `100%` assertion below converts that from a silent
# mis-tap into a loud, attributed failure.
#
# The two `Unable to (Call|Text)` guards below are attribution, not coverage. If a tap
# lands on a footer control, `canOpenURL('tel:')` is unconditionally false on the
# simulator (INFRA-184) so the manual-dial Alert appears — and it is MODAL, swallowing
# every later tap. Unguarded, that surfaces ~90s later as "Home never appeared", pointing
# at onboarding instead of at the stray tap. The first catches a miss from the consent
# taps above, the second a miss by the Continue tap itself.
#
# HONEST LIMIT on those two lines specifically: they are UNVERIFIED against a live Alert —
# proving they can fire would mean deliberately tapping a 988 control, which no flow may
# do. They must not be read as evidence that a mis-tap WOULD be caught. If a future run
# ever does surface the fallback Alert, confirm the regex actually matched it first.
- assertNotVisible:
    text: ".*Unable to (Call|Text).*"
- swipe:
    start: "50%, 65%"
    end: "50%, 25%"
- swipe:
    start: "50%, 65%"
    end: "50%, 25%"
- swipe:
    start: "50%, 65%"
    end: "50%, 25%"
- waitForAnimationToEnd
# PROVE the clamp was reached before tapping (crisis review C1). Three flicks is a
# measured 375x667 constant and this helper runs on unknown device viewports; at an
# INTERMEDIATE offset Continue can sit inside the footer band, be reported by XCUITest,
# and be tapped — which is precisely the defect being replaced. iOS publishes the vertical
# scroll indicator as a node whose text is the offset as a percentage of scrollable range,
# so this reads scroll POSITION directly rather than inferring it from visibility. Matched
# as exactly "100%": a 99% reading is evidence the flick count has gone short, not noise.
- assertVisible:
    text: "100%"
- tapOn:
    id: "legal-gate-continue"
- assertNotVisible:
    text: ".*Unable to (Call|Text).*"

# ── Step 2: Onboarding ────────────────────────────────────────────
# Onboarding sequence (per OnboardingScreen.navigateNext + CleanRootNavigator
# AssessmentFlow stack screen):
#   1. Welcome           → "Begin Your Practice"  → opens PHQ-9 modal
#   2. PHQ-9 (9 q's, Q1 direct — no intro in onboarding context)
#   3. GAD-7 (7 q's, Q1 direct — same)
#   4. Stoic Intro       → "Continue"
#   5. Notifications     → "Continue" (or "Set up later" — both navigateNext)
#   6. Privacy           → "Continue"
#   7. Celebration       → "Explore App" (testID="onboarding-explore-app")
#
# INFRA-183: AssessmentFlow modal jumps STRAIGHT to Q1 in onboarding context
# — CleanRootNavigator.tsx sets `showIntroduction={route.params.context ===
# 'standalone'}`, so onboarding suppresses the intro screen (and its
# Skip-for-Now button). The only way through is to answer all 16 questions.
# Each tap fires onAnswer → setCurrentQuestionIndex(prev + 1) auto-advance
# (EnhancedAssessmentFlow.tsx:284-285), so no Next/Continue button between
# questions. Tap option-0 ("Not at all" / "Never") to keep all scores at 0
# and avoid any crisis-threshold side effects.
- tapOn:
    text: "Begin Your Practice"
    optional: true

# PHQ-9 — 9 questions, "Not at all" (option-0) each.
#
# INFRA-208: the prior blind `repeat: { times: 9 }` fired 9 taps with NO
# settle between them. Each tap auto-advances (onAnswer →
# setCurrentQuestionIndex(prev+1), EnhancedAssessmentFlow.tsx:284-285); on a
# slower/loaded sim a tap landed mid-transition (before the next question's
# radio mounted) and was dropped, leaving the assessment short so onboarding
# never reached Stoic Intro — the non-deterministic Phase 2.5 gate failure.
#
# Fix: unroll the loop and wait for each question's progress counter before
# tapping, so the prior auto-advance has settled (radio mounted) first. The
# counter is a single text node — "Question {currentStep} of {totalSteps}"
# (EnhancedAssessmentQuestion.tsx:313-318) — so it's a reliable per-question
# settle signal that adapts to sim speed (no fixed sleeps). A static `repeat`
# can't express this because the post-condition changes every iteration.
# Each `timeout` is a failure ceiling only — the wait returns the instant the
# counter is visible, so the assessment section stays well within ≤45s.
# NOTE: Maestro's `text:` is a FULL-MATCH regex, and RN merges this counter's
# Text with the sibling progress-bar accessibilityLabel into one node whose
# accessibility string is "Question N of M, Progress: N of M questions
# completed" (verified via `maestro hierarchy`, INFRA-208). A bare
# "Question N of M" therefore does NOT match — wrap in `.*…*` to full-match
# the merged string.
- extendedWaitUntil:
    visible:
      text: ".*Question 1 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 2 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 3 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 4 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 5 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 6 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 7 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 8 of 9.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 9 of 9.*"
    timeout: 10000
# Answers PHQ-9 Q9 → onComplete dismisses the modal → a 50ms setTimeout
# (OnboardingScreen.tsx:824) launches GAD-7. The next wait below bridges that
# gap (and the brief `completing` ActivityIndicator) deterministically:
# "Question 1 of 7" can't appear until GAD-7 Q1 has mounted.
- tapOn:
    id: "assessment-response-group-option-0"

# GAD-7 — 7 questions, same wait-then-tap pattern. After Q7 → Stoic Intro.
- extendedWaitUntil:
    visible:
      text: ".*Question 1 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 2 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 3 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 4 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 5 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 6 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"
- extendedWaitUntil:
    visible:
      text: ".*Question 7 of 7.*"
    timeout: 10000
- tapOn:
    id: "assessment-response-group-option-0"

# Stoic Intro → Notifications → Privacy: each has a "Continue" CTA at the
# bottom of a scrollable section that may be below the fold (5-principle
# list on Stoic Intro is the tallest). scrollUntilVisible is a no-op when
# the element is already in viewport, so safe to apply uniformly.
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn:
    text: "Continue"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn:
    text: "Continue"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn:
    text: "Continue"

# Final screen — Explore App routes to Main tabs.
- tapOn:
    id: "onboarding-explore-app"

# ── Step 3: Verify we landed on Main ─────────────────────────────
# Use testID rather than text: the bottom Home tab label is rendered with
# accessibilityText "Home, tab, 1 of 4" (per iOS Tab Bar conventions) and
# Maestro's `text:` selector doesn't match against accessibilityText. The
# home-screen testID is the canonical "we are on Main" signal.
- assertVisible:
    id: "home-screen"
