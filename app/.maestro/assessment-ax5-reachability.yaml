# Every answer is 3, so Q9 > 0 AND total 27 >= 20. The banner must be on screen with no
# scroll in front of it: a crisis affordance reachable only by scrolling is the weaker
# contract (DEBUG-477). If this fails at AX5, file it; do not add a scroll.
- extendedWaitUntil:
    visible:
      id: "results-crisis-banner"
    timeout: 10000

# AC3: the prominent crisis button stays reachable over a scrolled question. It sits
# outside the ScrollView, so a mid-content scroll cannot swallow its tap. No absorbing tap
# and no waitForAnimationToEnd here, deliberately.
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: _seeded-home.yaml
- scrollUntilVisible:
    element:
      text: "Assessment status: Recommended.*"
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: "tab-home" # absorbing tap; Home is the active tab, so it navigates nowhere
- tapOn: "Assessment status: Recommended.*"
- extendedWaitUntil:
    visible:
      id: "assessment-close-button" # the intro, not a swallowed tap left on Home
    timeout: 15000
- scrollUntilVisible: # the intro is roughly one word per line at AX5; 60s at speed 40 did not reach Begin
    element:
      id: "assessment-begin-button"
    direction: DOWN
    timeout: 240000
    speed: 70
- tapOn:
    id: "assessment-begin-button"
- extendedWaitUntil:
    visible:
      text: ".*Question 1 of 9.*"
    timeout: 15000
- swipe:
    direction: UP
    duration: 600
- tapOn:
    id: "assessment-crisis-button"
- extendedWaitUntil:
    visible:
      id: "crisis-resources-screen"
    timeout: 10000
