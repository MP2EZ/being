appId: fyi.being.app
tags:
  - safety
name: "Crisis button (single root mount) reaches CrisisResources from every surface"
# e2e-certifies: 375x667
# INFRA-486 — Asserts crisis-call-988-button visible against the fold on the one screen where the
# root overlay is SUPPRESSED, so this control is the only 988 affordance there.
---
# Pins the safety fact: 988 access <3 taps from any screen. Asserts that the
# SINGLE persistent root-level crisis button (MAINT-290, testID
# "crisis-button-root") successfully navigates to CrisisResources from each of
# the 4 main tabs AND every Profile subscreen depth. Replaces the dormant Detox
# crisis-access.e2e.ts.
#
# MAINT-290 (Flow Redesign 1): the crisis button was promoted from ~11
# per-screen / per-navigator CollapsibleCrisisButton mounts to ONE persistent
# overlay mounted at the navigation root (sibling of the root Stack.Navigator,
# see CleanRootNavigator.tsx → RootCrisisButton). Because the button is no longer
# each screen's responsibility to mount, a screen or future practice step can no
# longer ship with no 988 access. Every per-screen testID (crisis-home,
# crisis-learn, crisis-insights, crisis-profile, crisis-morning-flow, …) is now
# the single stable id "crisis-button-root".
#
# CARVE-OUTS (deliberately NOT walked here; pinned by RootCrisisButton.test.tsx
# instead, which is deterministic + CI-run, unlike this local-only device flow):
#   • AssessmentFlow — keeps its own per-screen `prominent` buttons; the root
#     overlay is SUPPRESSED there (MAINT-290 must not touch the assessment flow).
#   • CrisisResources — the destination itself; overlay suppressed.
#   • LegalGate — owns a persistent inline Call-988 / Text footer, pinned OUTSIDE its
#     ScrollView (DEBUG-390) so it is reachable without scrolling; suppressed on that
#     condition, not merely because the controls exist. Not walked here: this flow boots
#     via _seeded-home.yaml, which seeds consent and onboarding, so it structurally cannot
#     reach LegalGate. That contract lives in deeplink-consent-gate.yaml, which already
#     stands on LegalGate in the post-dismiss state DEBUG-372 created.
#   • Practice flows/timers (Morning/Midday/Evening, PracticeTimer, BodyScan, …)
#     now DO carry the root overlay in `immersive` mode — previously the exact
#     "steps with no 988 access" gap this refactor closes. Their on-device walk
#     needs a long check-in preamble (preamble-skip is a tracked INFRA-216
#     follow-up), so route→mode/suppression is asserted in RootCrisisButton.test.tsx.
#
# Maestro's default assertVisible timeout (~10s) covers the <3s SLA from CLAUDE.md.
# On-device timing budgets live in CLAUDE.md's "Performance Budgets" section and
# are validated by hand until a real perf harness exists.
#
# DEBUG-392 — every `crisis-resources-screen` assertion below is followed by
#   - extendedWaitUntil: { notVisible: "Unable to Call", timeout: 3000 }
#
# Why. DEBUG-341 gave RootCrisisButton a fallback: if `navigationRef.isReady()` is
# still false 400ms after the tap (NAV_READY_DEADLINE_MS), it stops waiting and calls
# `openCrisisUrl('tel:988')` instead of navigating. On the SIMULATOR that dial cannot
# complete — `canOpenURL('tel:')` is unconditionally false there, independent of
# LSApplicationQueriesSchemes — so openCrisisUrl.ts renders its manual-dial alert,
# titled "Unable to Call". That string is app-owned and nothing else on this path
# produces it, which makes it a precise witness that the degraded branch fired.
#
# This flow otherwise cannot tell "navigated" from "dialled, then recovered": it only
# ever asserts the destination is present. Distinguishing them matters because the two
# outcomes are not equivalent — dialling skips the resource list, the safety plan and
# the text-line option that CrisisResources carries.
#
# Placed AFTER the assertVisible, never before. `extendedWaitUntil: notVisible` returns
# the instant its condition holds, so at t=0 — before an alert ~500ms out could render —
# it would pass vacuously and mask the very thing it is here to catch. After the
# assertion it can only ever add a check.

- launchApp:
    clearState: true
    clearKeychain: true # SecureStore-backed consent persists across clearState — wipe keychain too (INFRA-179)
- runFlow: _seeded-home.yaml # INFRA-217: e2e-sim seeds onboarding; start at home

# Tabs are addressed via tabBarTestID (INFRA-183, CleanTabNavigator.tsx) —
# Maestro's text: selector doesn't match the bottom-tab accessibilityText
# "X, tab, N of 4" patterns because the text field itself is empty.

# ── DEBUG-299: drag-then-tap ─────────────────────────────────────
# The rest of this flow only ever TAPS the button, which is why it passed for
# two releases while the shipped build had a crisis button that could vanish.
#
# The reported failure needed a drag: the button carried a Gesture.Pan whose
# worklets captured `collapsedWidth` before it was initialised, so panning
# wrote NaN into the transform. A NaN transform on iOS/Fabric is neither drawn
# nor hit-testable, and the single root mount (MAINT-290) never unmounts — so
# one drag removed 988 access from EVERY screen for the rest of the session.
# The pan has since been removed entirely; this segment pins that no future
# gesture can reintroduce the failure.
#
# Runs FIRST and on Home, matching the verbatim user report ("on the main
# screen"). If this regresses, every segment below it fails too — which is the
# correct blast radius for a button that is gone app-wide.
- tapOn:
    id: "tab-home"
- swipe:
    from:
      id: "crisis-button-root"
    direction: LEFT
# Still present after the drag. Before the fix the layer was not drawn here.
- assertVisible:
    id: "crisis-button-root"
# Still INTERACTIVE after the drag — the load-bearing half. A drag used to leave
# the button mounted-but-inert, so assertVisible alone would not have caught it.
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- extendedWaitUntil:
    notVisible: "Unable to Call"
    timeout: 3000
- tapOn:
    id: "nav-back-button"

# ── Home tab ─────────────────────────────────────────────────────
- tapOn:
    id: "tab-home"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- extendedWaitUntil:
    notVisible: "Unable to Call"
    timeout: 3000

# ── DEBUG-432: the DESTINATION's own 988 control is above the fold ──────────────
#
# Every other assertion in this flow stops at "the destination is present". That
# left the destination itself unverified, and it was broken: crisis-call-988-button
# was the last child of the 988 card, inside this screen's only ScrollView.
# Measured with `maestro hierarchy` (Release build, provenance 505fc417):
#
#   iPhone SE 3  375x667  DEFAULT type  fold y=86..667   button y=746..797
#   iPhone SE 3  375x667  AX5           fold y=86..667   button y=3926..4095
#   16 Pro Max   440x956  default type  fold y=128..956  button y=776..827  (ok)
#   16 Pro Max   440x956  AX5           fold y=128..956  button y=3612..3781
#
# CrisisResources is in RootCrisisButton.SUPPRESSED_ROUTES, so this is the ONLY
# 988 affordance on the screen every other crisis affordance routes TO.
#
# ASSERTED AS A PAIR, AND THE SECOND HALF IS NOT OPTIONAL. A bare assertVisible
# here would be indistinguishable from a predicate that had stopped discriminating
# — which is exactly how this defect survived: deeplink-consent-gate.yaml has
# asserted this same id visible on this same screen, green, for its whole life.
# It was green because it only ever ran on whatever simulator happened to be
# booted, and scripts/e2e-sim-device.sh pins no MODEL. The assertion was correct;
# its configuration was uninformative.
#
# crisis-resources-footer-disclaimer is the ScrollView's last unconditional child,
# so it is structurally below the fold on every device. Asserting it NOT visible
# in the same breath re-proves the driver can still see clipping, on every run.
#
# DEVICE MATTERS HERE AND THE RUNNER DOES NOT PIN IT. A green result on a 6.9"
# simulator does NOT certify a 4.7" one — the pre-fix build passed this assertion
# on a 16 Pro Max and failed it on an SE 3. Run the gate on the SMALLEST supported
# viewport (iPhone SE 3, 375x667) or the result understates coverage.
- assertVisible:
    id: "crisis-call-988-button"
- assertNotVisible:
    id: "crisis-resources-footer-disclaimer"
# INFRA-185: pop the CrisisResources modal via the explicit nav-back-button
# testID added to CleanRootNavigator's HeaderBackButton override. Maestro's
# `- back` action on iOS 18.6 sim reports COMPLETED but doesn't actually
# pop modal-presentation stack screens; left-edge swipe doesn't honor them
# either. Tapping the testID-tagged back button is the mechanically
# reliable route.
- tapOn:
    id: "nav-back-button"

# ── Learn tab ────────────────────────────────────────────────────
- tapOn:
    id: "tab-learn"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- extendedWaitUntil:
    notVisible: "Unable to Call"
    timeout: 3000
- tapOn:
    id: "nav-back-button"

# ── Insights tab ─────────────────────────────────────────────────
# DEBUG-189: re-enabled. The FeatureGate wrapper around InsightsScreen was
# removed (CleanTabNavigator.tsx) — it was incidental FEAT-16-deferral debris,
# not an intentional v1 paywall. The root crisis overlay renders unconditionally
# on this tab like every other surface (crisis features are ALWAYS accessible,
# regardless of subscription — CLAUDE.md Safety Fact).
- tapOn:
    id: "tab-insights"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- extendedWaitUntil:
    notVisible: "Unable to Call"
    timeout: 3000
- tapOn:
    id: "nav-back-button"

# ── Profile tab ──────────────────────────────────────────────────
# FEAT-212: Profile migrated to a nested React Navigation stack
# (ProfileStackNavigator). MAINT-290 removed the per-navigator crisis overlay
# it once hosted; the single ROOT overlay now covers every Profile route
# (landing + every pushed subscreen) — the precise regression this migration
# risks. We visit each depth-1 route + representative depth-2 routes and assert
# crisis-button-root → crisis-resources-screen from each.
#
# INFRA-220: each subscreen check is self-contained and starts from the Profile
# menu root via a `tab-profile` re-tap. React Navigation's default bottom-tab
# behavior pops the focused tab's stack to root (CleanTabNavigator sets no
# tabPress override), so re-tapping the already-focused Profile tab returns to the
# menu regardless of current depth. This replaces the previous `nav-back-button` +
# `profile-back-button` pop pairs, which were fragile: on a non-pristine sim the
# CrisisResources modal's `nav-back-button` intermittently OVER-pops (dismissing
# the modal AND the underlying subscreen), landing on the menu where
# `profile-back-button` doesn't exist — failing "profile-back-button not visible"
# (observed in the INFRA-217 /b-close gate). The tab re-tap resets to a known
# state no matter how far nav-back-button popped, so the flow is immune to the
# over-pop. nav-back-button still dismisses the modal (which covers the tab bar)
# before each tab-reset.
#
# NOTE: the Privacy → CloudBackup depth-2 route is gated by the cloud_sync feature
# flag (dark by default), so its entry row is not present in this default-build
# run; that route's overlay hosting is pinned by ProfileStackNavigator.test.tsx.
# Legal → LegalDocument (ungated) provides the on-device depth-2 assertion here.

# menu route (Profile tab landing)
- tapOn:
    id: "tab-profile"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- extendedWaitUntil:
    notVisible: "Unable to Call"
    timeout: 3000
- tapOn:
    id: "nav-back-button"

# ── DEBUG-406: the education sheet must not occlude the button ───
# The sheet at ProfileScreen's ⓘ was a real RN <Modal> until DEBUG-406. An RN
# <Modal> renders in a separate native window ABOVE the JS view hierarchy, so
# while it was open `crisis-button-root` was not dimmed — it was not on screen,
# a zero-988-affordance state. It is now a full-bleed absolute overlay published
# into the root overlay slot, which paints immediately BELOW this button.
#
# This TAPS THROUGH rather than merely asserting visibility, and that is the
# whole point of doing it here instead of in jest. Under a native-layer
# occlusion bug the hierarchy dump can still LIST a view that another native
# window is covering, so `assertVisible` alone would have passed against the
# original defect. Only tap-and-land is evidence.
#
# Placed in the Profile block because the trigger lives on the Profile menu; it
# re-taps `tab-profile` first like every other segment here, so it is immune to
# wherever the previous nav-back-button landed.
- tapOn:
    id: "tab-profile"
- tapOn:
    id: "profile-assessment-info"
# The sheet is up. Under the old <Modal> this next assertion was impossible —
# the button did not exist in the hierarchy at all.
- assertVisible:
    id: "threshold-education-overlay"
- assertVisible:
    id: "crisis-button-root"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- extendedWaitUntil:
    notVisible: "Unable to Call"
    timeout: 3000
- tapOn:
    id: "nav-back-button"
# The sheet survives the round trip — the user returns to where they were, not
# to a dismissed sheet. Post-condition, not a tap: DEBUG-403's failure was a tap
# that reported COMPLETED while the app never received it.
- assertVisible:
    id: "threshold-education-overlay"
# And its own dismissal still works after the excursion. This also pins that the
# dismiss control is reachable — it was moved OUT of the sheet's ScrollView in
# DEBUG-406, where it could be pushed below the fold.
- tapOn:
    id: "threshold-education-dismiss"
- assertNotVisible:
    id: "threshold-education-overlay"

# depth-1: Notifications & Display
- tapOn:
    id: "tab-profile" # re-tap → pop ProfileStack to menu root (immune to over-pop)
- scrollUntilVisible:
    element:
      id: "profile-card-appsettings"
    direction: DOWN
- tapOn:
    id: "profile-card-appsettings"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- extendedWaitUntil:
    notVisible: "Unable to Call"
    timeout: 3000
- tapOn:
    id: "nav-back-button"

# depth-1: Privacy & Data
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "profile-card-privacy"
    direction: DOWN
- tapOn:
    id: "profile-card-privacy"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- extendedWaitUntil:
    notVisible: "Unable to Call"
    timeout: 3000
- tapOn:
    id: "nav-back-button"

# depth-2: Privacy & Data → Export My Data (FEAT-267). The data-subject-rights
# screens are pushed routes inside ProfileStackNavigator, so the root crisis
# overlay must remain reachable on them — the exact regression a new pushed
# subscreen risks. Placed in the Privacy menu slot (NOT appended after Legal):
# `scrollUntilVisible direction:DOWN` is one-directional and the `tab-profile`
# re-tap pops the stack without resetting the menu ScrollView offset, so a
# segment whose card sits ABOVE the prior segment's would never scroll back up.
# centerElement:true is required on these card scrolls: scrollUntilVisible
# otherwise stops with the card at the screen's bottom edge (near the floating
# crisis button), where the subsequent tap doesn't land cleanly enough to fire
# navigation — it silently stays on the menu. Centering the card before the tap
# makes the push reliable. (The existing depth-1 segments don't need this only
# because their crisis assertion is satisfiable by the menu's own overlay.)
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "profile-card-privacy"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "profile-card-privacy"
# ── DEBUG-473: BUDGET, NOT GEOMETRY — and not device-specific ────────────────────
# This flow was reported RED at 402x874. It is not: it passes 5/5 there on an idle
# machine, unmodified. What it was, was one second away from failing.
#
# Measured on iPhone 16 Pro / iOS 18.6 (402x874), Release build, clean provenance
# e85abc3a, `maestro hierarchy` taken in the live failing state:
#
#   ScrollView clip (the fold)  [0,162][402,756]     594pt
#   scroll content view         [0,-1446][402,756]   2202pt -> 1608pt overflow (2.7x fold)
#   profile-card-export         [24,425][378,542]    100% inside the fold at max scroll
#   profile-card-delete         [24,558][378,676]    100% inside the fold, ~198pt trailing
#
# Neither card is ever clipped, so there is NO fold defect on this screen and
# PrivacyDataScreen is not implicated — both data-rights affordances, export and
# erasure, are reachable at this viewport. The two scrolls were simply sitting at the
# edge of their default 20000ms budget: export 10.5s (52%), delete 19.0s (95%), across
# five runs with <1% variance. Ambient machine load is then enough to flip either one.
#
# DELETE'S COST IS NOT TRAVEL. It is FOUND after 3 swipes; the following 5 (~8.7s) are
# Maestro trying to CENTRE it and failing. At maximum scroll its centre sits 158pt below
# the fold's with only ~198pt of trailing content, so centring is unsatisfiable by
# construction and those attempts are a fixed tax no scroll-speed change removes.
#
# Measured quiet-machine cost against the default 20000ms budget, both viewports:
#
#   device / runtime            viewport   export        delete
#   ──────────────────────────  ─────────  ────────────  ─────────────────────
#   iPhone 16 Pro / iOS 18.6    402x874    10.5s  (52%)  19.0s  (95%)  8 swipes
#   iPhone SE 3   / iOS 18.6    375x667    12.3s  (62%)  12.3s  (62%)  5 swipes
#
# SE pays LESS on delete despite the smaller viewport: its card centres to within 111pt
# against the 16 Pro's 158pt, so it abandons the centring attempt sooner. That inversion is
# the third independent disconfirmation of a device-specific cause, after the geometry and
# the wandering failure element.
#
# BOTH VIEWPORTS SAT OVER HALF THEIR BUDGET WHILE GREEN (52%/95% and 62%/62%). That is the
# actual defect and the whole justification for hardening: the flow was under-budgeted on
# every device, silently, and only surfaced when contention consumed the margin.
#
# DO NOT "FIX" THE 95% BY DROPPING centerElement ON DELETE. The futile centring IS the
# price of DEBUG-453's fix, and DEBUG-453 measured what removing it costs: the scroll stops
# short of maximum, reports COMPLETED anyway, and the tap misses. The waste is load-bearing.
#
#   timeout: 48000 = a 2.5x safety factor over the worst measured quiet-machine cost across
#                    BOTH viewports (16 Pro delete, 19009ms). Post-fix worst is 46.9%.
#
# SIZE IT AGAINST THE MEASUREMENT, NOT AGAINST THE DEFAULT. 20000 is Maestro's generic
# number and was never derived for a 1608pt traverse, so "2.4x the default" is the wrong
# framing and invites a trim. The denominator that matters is the measured cost. The one
# ceiling this must respect: it must NOT be large enough to absorb a host on which this
# flow's own crisis assertions are untrustworthy — the 3000ms `Unable to Call` windows and
# the ~10s assertVisible standing in for the <3s 988 SLA. At the measured contention cost
# (13.7s per iteration x 8) delete needs ~110s, so 48000 still fails loudly there.
#
# COST IS PARTLY BUDGET-DEPENDENT, so % of budget is not a fixed property: delete measured
# 19.0s under the 20000 budget and 22.4s under 48000, at the SAME 8 swipes — the centring
# phase makes a few more attempts when given room. Cost rose 3.4s for 28s of budget, so the
# headroom is real, but re-measure rather than extrapolating if this number is ever changed.
#
# WALL-CLOCK CEILING GROWS. Worst case adds ~56s across the two scrolls before a red is
# reported. Phase 2.5 operators should expect the longer failure path; a slow honest red
# beats a fast dishonest green.
#
# NEVER BUY SCROLL BUDGET WITH SCROLL SPEED ON THIS FLOW. Standing prohibition, not a
# one-off: leave the scroll rate at Maestro's default on every scroll here.
#
# It was tried. Raising the rate did compress the traverse (16 Pro: delete 95% -> 65%,
# export 52% -> 31%) and it REGRESSED iPhone SE 3, where the unmodified flow passes — the
# scroll reported COMPLETED, the tap on profile-card-export fired and reported COMPLETED,
# and export-data-screen never appeared. That is DEBUG-453's exact symptom, re-created.
#
# MECHANISM: find-then-tap is not atomic. Maestro locates the element, then taps captured
# coordinates; a faster fling leaves the ScrollView still decelerating in between, so the
# element is found and then moves out from under the tap. The argument that overshoot is
# harmless here — both targets are 100% inside the fold at max scroll, so a fling that
# clamps at the bottom still lands somewhere findable — is about FINDABILITY and says
# nothing about TAP TIMING.
#
# WHY IT GENERALISES: this flow's whole value over ProfileStackNavigator.test.tsx is that
# it taps and LANDS (see the DEBUG-406 block: "Only tap-and-land is evidence"). Any
# parameter that raises kinetic energy at tap time trades away the property under test.
# Timeout buys budget without touching the gesture; scroll rate buys it by making every
# gesture more hazardous. Note also the viewport asymmetry, which is the part that
# generalises: it bit at 375x667 while 402x874 stayed green, so validating a scroll change
# on one viewport proves nothing about the other.
#
# The timeout is deliberately NOT sized to survive a contended machine. At the load this
# was first reported under (load avg 483; two peer Maestro drivers plus an Xcode build)
# one scroll iteration cost 13.7s and this flow took 45m20s — a machine on which the
# thirteen crisis assertions in this file are not trustworthy either, so it must still
# fail loudly rather than be tuned green.
#
# THE ORIGINAL RED WAS CONTENTION, NOT THE DEVICE. Under load the failing element
# WANDERED between profile-card-export and profile-card-delete across runs of a
# byte-identical tree. Geometry is deterministic about which element it hides; a budget
# is not. Do not read this block as a device-specific failure and do not go looking for
# one at 402x874.
- scrollUntilVisible:
    element:
      id: "profile-card-export"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 48000
- tapOn:
    id: "profile-card-export"
- assertVisible:
    id: "export-data-screen"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- extendedWaitUntil:
    notVisible: "Unable to Call"
    timeout: 3000
- tapOn:
    id: "nav-back-button"

# depth-2: Privacy & Data → Delete Account (FEAT-267). The DeleteAccount
# confirmation screen is the most crisis-sensitive surface in this feature, so
# we assert crisis reachability HERE — landing on the confirmation screen
# (pre-typed-confirmation) and backing out. We deliberately do NOT type DELETE
# or press the destructive button: driving the real erasure would wipe the
# seeded sim state. Crisis reachability is the only contract under test here.
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "profile-card-privacy"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "profile-card-privacy"
# profile-card-delete is the BOTTOM-MOST element on the Privacy screen. It needs
# centerElement:true for the same reason every other card scroll here does —
# without it scrollUntilVisible stops short of maximum scroll and reports
# COMPLETED anyway. Measured on iPhone SE 3 (DEBUG-453): it stopped at 87% with
# the card at [24,623][351,740], entirely below the ScrollView's clip bottom of
# 583, then tapped its centre at y=681.5 and hit nothing. At true maximum the
# card sits at [24,385][351,503] — fully visible, 80pt of trailing padding below.
# visibilityPercentage stays 60: the threshold was never the problem, so lowering
# OR raising it would both miss the defect (DEBUG-432 rejected lowering it).
# speed/timeout here are DEBUG-473's, sized above; DEBUG-453's account is unchanged —
# its symptom was scrollUntilVisible reporting COMPLETED at 87% and a tap that hit
# nothing, a geometric stop-short. DEBUG-473's is CommandFailed, target never reached.
- scrollUntilVisible:
    element:
      id: "profile-card-delete"
    direction: DOWN
    visibilityPercentage: 60
    centerElement: true
    timeout: 48000
- tapOn:
    id: "profile-card-delete"
- assertVisible:
    id: "delete-account-screen"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- extendedWaitUntil:
    notVisible: "Unable to Call"
    timeout: 3000
- tapOn:
    id: "nav-back-button"

# depth-1: Account
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "profile-card-account"
    direction: DOWN
- tapOn:
    id: "profile-card-account"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- extendedWaitUntil:
