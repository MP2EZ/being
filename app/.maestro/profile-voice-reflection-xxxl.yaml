appId: fyi.being.app
tags:
  - safety-dynamic-type
name: "Profile -> VoiceReflection at XXXL (DEBUG-507): the save-time crisis scan stays reachable at the largest non-accessibility text size"
---
# DEBUG-507 — the SECOND flow in the `safety-dynamic-type` class (DEBUG-469 built the first).
#
# Run it with `npm run e2e:safety:xxxl`, NEVER with a bare `maestro test`. The wrapper
# (scripts/e2e-dynamic-type.sh) sets the size and restores it in a trap; content size is
# device-global and persistent, so a bare run leaves this machine's shared simulator
# poisoned and silently invalidates the next worktree's layout assertions.
#
# NOTE THE SIZE. DEBUG-469's flow runs at `accessibility-extra-extra-extra-large`, which is
# the wrapper's default. This one runs at `extra-extra-extra-large` — the largest
# NON-accessibility step, i.e. the largest size reachable from the ordinary iOS text-size
# slider without turning on Larger Accessibility Sizes. The npm script supplies it via
# E2E_DYNAMIC_TYPE_SIZE; running this flow at the wrapper's default asserts a different
# size than it was measured at.
#
# WHY THIS SURFACE. VoiceReflectionScreen hosts `scanOnSave`, the app's only crisis scan of
# text a user typed or corrected, plus journal-crisis-banner and journal-crisis-call-988.
# `features/journal/` is a Protected Path for exactly that reason. This flow pins the ENTRY
# to it; journal-crisis-scan.yaml pins the scan itself, at the default text size.
#
# ── WHY THE SCROLL TIMEOUT IS 40000 AND NOT THE DEFAULT ────────────────────────
# Load-bearing, and the single edit that silently restores the defect DEBUG-507 filed.
# At this size the Profile list is ~1.35x taller (the voice-reflection card measures 279pt
# against 203pt at default) and Maestro's default 20000 ms budget does not reach the last
# card: the step fails with `No visible element found` and the tap is never issued.
# MEASURED on iPhone SE (3rd gen) / iOS 18.6 / 375x667: 7 of 7 runs failed at 20000 ms;
# 15 of 18 passed at >= 30000 ms. DEBUG-473 had already measured this class at 95% of its
# scroll budget on an IDLE machine at the DEFAULT size — the larger size just spends the
# remainder. 40000 leaves headroom for a contended host, where DEBUG-473 measured a single
# scroll iteration at up to 13.7s against ~1.5s idle.
#
# ── THE ABSORBING TAP, AND WHAT IS NOT KNOWN ABOUT IT ──────────────────────────
# DEBUG-479 established that XCUITest's synthesised first tap after a flick is swallowed on
# a mid-list card, and e2e-maestro.md records that THIS card is normally immune because, as
# the LAST card, its DOWN scroll terminates at the bottom boundary. That immunity is
# TYPE-SIZE-DEPENDENT and does not hold here: at this size the swallow reproduced 3 times
# (scroll COMPLETED, tap COMPLETED, no navigation) during a high-load burst.
#
# The absorbing tap below is the house remedy from DEBUG-477/479. It is carried on that
# PRECEDENT, not on local evidence: a 5-vs-5 comparison on an idle host could not
# discriminate, because the control also passed 5/5 — the defect did not reproduce in
# either arm, so the run had no power. Do not cite it as validation, and do not remove this
# line on the grounds that the flow is green without it.
- launchApp:
    clearState: true
    clearKeychain: true # SecureStore-backed consent survives clearState (INFRA-179)
- runFlow: _seeded-home.yaml # INFRA-217: e2e-sim seeds onboarding; start at home

- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "profile-card-voice-reflection"
    direction: DOWN
    centerElement: true # DEBUG-477 — load-bearing, see journal-crisis-scan.yaml
    timeout: 40000 # DEBUG-507 — load-bearing, see header
# DEBUG-477/479 absorbing tap: an element-anchored target OUTSIDE the ScrollView.
# tab-profile is already the active tab; this re-tap is deliberate, not a copy-paste slip.
- tapOn:
    id: "tab-profile"
- tapOn:
    id: "profile-card-voice-reflection"

# AC 1 — the entry completes at this text size. This is the whole point of the flow.
- extendedWaitUntil:
    visible:
      id: "voice-reflection-screen"
    timeout: 8000

# ── AC 3 / DEBUG-516 — THIS FLOW NOW TAPS SAVE, AND THAT IS THE POINT ────────
# It used to stop at the keyboard, because the next step was BROKEN and pinning a broken
# contract green is worse than not pinning it. DEBUG-507 AC 3 re-measured DEBUG-480's
# clearance at this text size, against the full keyboard window ([0,407][375,667] — NOT
# `UIKeyboardLayoutStar Preview`, which is [0,451][375,667] and reports only the key layout,
# omitting the ~44pt predictive bar that occludes just as much):
#
#   content_size large  journal-save-button [24,377][279,429] centre y=403 -> clears by  4pt,  42% covered
#   content_size XXXL   journal-save-button [24,415][279,473] centre y=444 -> UNDER by  37pt, 100% covered
#
# The default-size row reproduces DEBUG-480's published figures exactly, which is what
# vouches for the method. At XXXL the button did not merely lose margin — it sat entirely
# beneath the keyboard, so the tap was swallowed and `journal-saved-state` never arrived.
#
# BOTH ROWS ARE PRE-DEBUG-516 AND PRE-DEBUG-506 EVIDENCE. They record where an
# in-ScrollView Save happened to land on one build; they are not thresholds. DEBUG-516
# moved Save out of the ScrollView and inset its container from the LIVE keyboard frame,
# which is the union UIKit reports (key layout + predictive bar + any inputAccessoryView).
# Clearance is therefore non-negative by construction and survives DEBUG-506 attaching the
# crisis accessory, which raises the occluding edge ~72pt on this surface. Do not re-derive
# anything from the coordinates above.
#
# Do NOT "fix" a failure here by asserting `journal-save-button` is visible: the iOS
# keyboard is a separate window, so XCUITest scores the button fully visible while it is
# 100% covered. That assertion is the exact false green DEBUG-480 exists to warn about.
# Do NOT add a scroll before the Save tap either — DEBUG-480 measured `scrollUntilVisible`
# reporting COMPLETED without scrolling here, and a scroll would weaken the contract from
# "reachable with the keyboard up" to "reachable after scrolling".
- tapOn:
    id: "journal-record-button"
- tapOn:
    id: "journal-stop-button"
- extendedWaitUntil:
    visible:
      id: "journal-transcript-input"
    timeout: 8000
- tapOn:
    id: "journal-transcript-input"
- inputText: "today was hard but i made it through and i slept well"
# Two-sided oracle (DEBUG-477): the keyboard itself is the only honest one, and asserting it
# visible proves the matcher still fires if iOS renames the identifier.
- assertVisible:
    id: "UIKeyboardLayoutStar Preview"

# ── THE DRAG DISMISSAL, FIRST — AND IT CANNOT BE A SECOND CAPTURE ────────────
# `keyboardDismissMode='on-drag'` is this surface's ONLY keyboard dismissal: the transcript
# field is multiline, so Return inserts a newline and there is no Done key. While DEBUG-506
# is open there is no working keyboard-up 988 affordance here either, so dismissal is also
# the only route back to a state where the root crisis button is reachable. DEBUG-516 shrank
# the scroll region — prose and transcript now yield space to the pinned footer — so "the
# content still scrolls, therefore the drag still dismisses" stopped being free. If the
# region ever stops being draggable the mitigation dies silently.
#
# WHY IT RUNS BEFORE THE SAVE AND INSIDE THE SAME CAPTURE. A first draft put this AFTER
# `journal-saved-state` as a fresh capture, because `swipe` destroys the keyboard-up
# condition the save block tests. That flow FAILED with `Element not found:
# journal-record-button` — the `saved` phase is TERMINAL BY DESIGN and offers no affordance
# back to `idle`, which VoiceReflectionScreen's own DEBUG-504 comment states outright. Do
# not "fix" a future failure here by adding one: any route back to `recording` that does not
# go through handleStart inherits the previous capture's draftId and silences its
# disclosure. That is the defect DEBUG-504 fixed.
#
# Dragging DOWN from the header rather than UP: at the top of the region this is an
# overscroll bounce, which still begins a drag (so `on-drag` fires) without carrying the
# transcript field off screen and stranding the steps below it.
- swipe:
    from:
      id: "journal-review-header"
    direction: DOWN
- extendedWaitUntil:
    notVisible:
      id: "UIKeyboardLayoutStar Preview"
    timeout: 8000

# Re-raise, so the save below is measured against a freshly-presented keyboard AND a scroll
# region the drag has already moved. That is strictly stronger than the pristine state the
# first draft would have tested: it is the pinned footer, not a lucky content offset, that
# has to keep Save reachable.
- tapOn:
    id: "journal-transcript-input"
- extendedWaitUntil:
    visible:
      id: "UIKeyboardLayoutStar Preview"
    timeout: 8000

# AC 1 + AC 4 — SAVE AT ITS RESTING POSITION, KEYBOARD UP, AT THE LARGEST NON-ACCESSIBILITY
# TEXT SIZE. No scroll, no dismissal, no visibility assertion on the button itself. The
# oracle is the state change: `journal-saved-state` is produced ONLY by handleSave's success
# branch, so it cannot be reached without the tap having landed — and handleSave is the only
# caller of scanOnSave, the app's sole crisis scan of text a user typed or corrected.
- tapOn:
    id: "journal-save-button"
- extendedWaitUntil:
    visible:
      id: "journal-saved-state"
    timeout: 8000
