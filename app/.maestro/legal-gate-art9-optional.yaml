appId: fyi.being.app
tags:
  - safety
name: "Art. 9 consent is refusable (FEAT-470): entry proceeds with the wellness tick unticked"
---
# FEAT-470 safety flow — pins, on the RUNNING app, the one user-visible contract this
# change creates: a user may DECLINE the GDPR Art. 9(2)(a) wellness-processing consent
# and still enter the app.
#
# WHY THIS FLOW EXISTS AT ALL
# ===========================
# The jest side already pins the capture contract
# (CombinedLegalGateScreen.consentInvariant.privacy.test.tsx), but jest renders the tree
# with a mocked consent store — it cannot show that the real Release build lets a refusing
# user through the gate. And no existing flow could cover it:
#   • 7 of the 8 sim safety flows enter via `_seeded-home.yaml`, and the e2e-sim build
#     seeds consent at launch (INFRA-217), so they never see LegalGate at all;
#   • `deeplink-consent-gate.yaml` does reach LegalGate but never ticks a box or presses
#     Continue, so it cannot observe either consent outcome;
#   • `_legal-and-onboarding.yaml` ticks all four and presses Continue — the ACCEPT path
#     only, and it is upstream of most of the suite, so it must not be repurposed.
# Refusal was therefore the one path with no on-device coverage.
#
# WHY THE BOOT STATE IS `?e2eSeed=ungranted`
# ==========================================
# Identical reasoning to `deeplink-consent-gate.yaml`: a consent gate cannot be tested from
# a build that has already granted consent. The marker suppresses the seed's writes only —
# the empty state comes from `clearState` + `clearKeychain`, exactly as a fresh install
# would. `stopApp` + `clearState` + `openLink` rather than `launchApp` because the marker
# must be visible to `Linking.getInitialURL()`, which only carries a URL on a cold start,
# and an intervening `launchApp` would run the seed unmarked and grant consent.
#
# SCOPE — deliberately stops at the gate
# ======================================
# This flow asserts that the gate RELEASES, and nothing further. It does not drive on to
# `home-screen`: that would drag in the 16-question onboarding traversal, which is the slow
# and brittle part of the suite and is already covered by `_legal-and-onboarding.yaml`.
# What happens to a refusing user's data after entry is FEAT-318's write-gate, which does
# not exist yet — asserting anything about it here would pin a contract the code does not
# yet make.
- stopApp
- clearState
- clearKeychain
- openLink: being://daily?e2eSeed=ungranted

# 90s: cold boot + encryption init on the Release build, mirroring the other cold-start
# flows. Landing on the gate is itself the precondition — `being://daily` is a gated link,
# so an ungranted boot resolves to LegalGate.
- extendedWaitUntil:
    visible:
      id: "legal-dob-picker"
    timeout: 90000

# ── The birth year. Required independently of any consent, so it MUST actually be set,
#    or the Continue assertion below would be about the missing year rather than about the
#    Art. 9 tick — the flow would pass for the wrong reason, or hang for the wrong reason.
#
# Mirrors `_legal-and-onboarding.yaml` exactly rather than inventing a shorter version.
# `@react-native-picker/picker` renders an inline UIPickerView on iOS whose wheel items are
# not tappable as text in the accessibility tree, so swiping is the only option, and the
# swipe must both start and end inside the picker's y-range or the parent ScrollView claims
# the gesture and the wheel never moves (INFRA-181). Anchoring on the picker's id keeps the
# coordinates from drifting with layout — and this screen's layout DID change in FEAT-470.
# Years are sorted descending from the current year, placeholder at index 0, so any of these
# lands on a year comfortably over 18.
# Bring the wheel fully on screen and centred BEFORE swiping. Anchoring a swipe on the
# picker's id is not sufficient on its own: if the wheel sits near a screen edge the
# gesture extends past its y-range, the PARENT ScrollView claims it, and the wheel never
# turns (INFRA-181 records the same failure from hardcoded coords). At the landing offset
# the picker is normally already visible, so this issues no swipe and cannot itself eat a
# touch.
- scrollUntilVisible:
    element:
      id: "legal-dob-picker"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
- tapOn:
    id: "legal-dob-picker"
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
# Fail fast if the wheel did not actually scroll. Without this, an unscrolled wheel leaves
# Continue disabled for a reason that has nothing to do with the Art. 9 tick, and the
# failure would surface 30s later at the final assertion looking like a regression in the
# thing under test.
# 🔴 BOTH assertions are required, and the order matters.
#
# `assertNotVisible: "Select year..."` ALONE IS A FALSE GUARD, and it is how this flow
# failed in a full-suite run while passing solo. The placeholder disappears in two very
# different situations: the wheel turned and a year is selected (what we want), or the
# ScrollView claimed the swipes and carried the whole picker off screen (what actually
# happened — the failure screenshot showed the picker gone, all three checkboxes still
# unticked, and every later tap landing on shifted content). Asserting the picker is
# STILL VISIBLE first is what separates the two.
- assertVisible:
    id: "legal-dob-picker"
- assertNotVisible:
    text: "Select year..."

# ── Tick the THREE required acceptances, and deliberately NOT the Art. 9 box ───────────
# testIDs sit on the 24px indicator View, not the outer Pressable (INFRA-181): the
# Pressable's bounding-box centre falls in the text region where an inline
# `Linking.openURL` link would intercept the tap and navigate away. The parent Pressable
# still receives the event via RN tap propagation.
#
# 🔴 `legal-consent-mh-processing` IS NOT TAPPED HERE, AND THAT IS THE ENTIRE POINT.
# Anyone "fixing" a failure in this flow by adding that tap has deleted the test.
# ── The three required ticks, each SCROLLED TO, VERIFIED, and re-tapped if swallowed ──
#
# 🔴 EVERY checkbox is scrolled to before it is tapped, including the FIRST. That is not
# defensive padding — it is the fix for the defect that made this flow unreliable across
# six suite runs, and removing it for the boxes that "look visible at landing" reproduces
# the failure exactly.
#
# At 375x667 the pinned 988 footer takes ~121pt off the ScrollView's viewport and the
# labels wrap hard, so even `legal-consent-tos` is clipped by the footer at the landing
# offset. XCUITest DROPS elements outside the SCREEN but KEEPS ones merely outside a
# ScrollView's clip (DEBUG-465), so Maestro scored these boxes visible, skipped scrolling,
# and tapped coordinates the footer was occupying. Every tap reported COMPLETED and no box
# ever ticked — which is what the failure screenshots showed, and why this looked like
# DEBUG-477's swallowed tap when it was not.
#
# `visibilityPercentage: 100` is the half that forces a REAL scroll; `centerElement` then
# lands the target mid-screen instead of flush against the fold. That pair is what
# DEBUG-477 credits for crisis-button-reachability being immune by construction.
#
# 🔴 WHY EVERY TAP IS FOLLOWED BY A CONDITIONAL RE-TAP. DEBUG-477: a swipe or scroll
# terminating mid-content causes UIScrollView to consume the NEXT touch as a zero-distance
# drag. Maestro reports that tap COMPLETED and the app never sees it. This flow performs
# both — five swipes on the picker wheel, then a scroll to reach the third box — so its
# taps are exposed to it, and observed reality matched: across five suite runs the failure
# screenshots showed ALL THREE boxes still unticked while Maestro reported every tap
# COMPLETED, and the flow then failed much later on an unrelated-looking assertion.
#
# `retryTapIfNoChange` cannot fix this and DEBUG-477 says so explicitly: the swallowed tap
# nudges the list 1-3pt, so Maestro sees "the hierarchy changed" and declines to retry.
# The defect defeats Maestro's own guard against it.
#
# So the oracle is not "did anything change" but "did the box actually tick". The check
# glyph renders ONLY when its state is true, so `legal-consent-<n>-check` existing IS the
# tick. One re-tap is sufficient by the predicate — exactly one touch is eaten — and the
# re-tap is safe precisely because it is conditional: if the first tap landed, the check is
# visible, the block does not run, and the box is never toggled back off.
- scrollUntilVisible:
    element:
      id: "legal-consent-tos"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
- tapOn:
    id: "legal-consent-tos"
- runFlow:
    when:
      notVisible:
        id: "legal-consent-tos-check"
    commands:
      - tapOn:
          id: "legal-consent-tos"
- assertVisible:
    id: "legal-consent-tos-check"

- scrollUntilVisible:
    element:
      id: "legal-consent-privacy"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
- tapOn:
    id: "legal-consent-privacy"
- runFlow:
    when:
      notVisible:
        id: "legal-consent-privacy-check"
    commands:
      - tapOn:
          id: "legal-consent-privacy"
- assertVisible:
    id: "legal-consent-privacy-check"

# ── The 988 footer survives the refusal state ─────────────────────────────────────────
# Re-pins DEBUG-390's above-the-fold guarantee in a consent state that did not exist before
# FEAT-470. `LegalGate` is in `RootCrisisButton`'s SUPPRESSED_ROUTES, so this footer is the
# only crisis affordance a user has before accepting anything. `assertVisible` defaults to
# 100% visibility, so this fails if either control is even partially clipped. No scroll
# action: the footer is a flex sibling OUTSIDE the ScrollView and must be reachable at the
# landing offset.
- assertVisible:
    id: "legal-gate-crisis-988"
- assertVisible:
    id: "legal-gate-crisis-text"

# The third required box is BELOW THE FOLD at 375x667 and always has been — the labels wrap
# hard at this width and the pinned footer takes ~121pt off the viewport. `centerElement`
# WITH `visibilityPercentage: 100` is the pair that forces a real scroll; centerElement
# alone lets XCUITest score a target visible while it is clipped behind the pinned footer
# (DEBUG-465), which is how an earlier revision stopped short.
- scrollUntilVisible:
    element:
      id: "legal-consent-wellness"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
- tapOn:
    id: "legal-consent-wellness"
- runFlow:
    when:
      notVisible:
        id: "legal-consent-wellness-check"
    commands:
      - tapOn:
          id: "legal-consent-wellness"
- assertVisible:
    id: "legal-consent-wellness-check"

# 🔴 The Art. 9 box is deliberately NEVER tapped. That is the entire point of this flow —
# anyone "fixing" a failure here by ticking it has deleted the test.

# ── Continue, at the bottom boundary ─────────────────────────────────────────────────
# Continue is the LAST child of this ScrollView, so this scroll clamps at the content
# boundary. Arrival assertion first so a short scroll is attributed in ~2s rather than
# surfacing 30s later as the final `notVisible` timing out, which would read as the gate
# refusing to release.
- scrollUntilVisible:
    element:
      id: "legal-gate-continue"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
- assertVisible:
    id: "legal-gate-continue"
- tapOn:
    id: "legal-gate-continue"

- extendedWaitUntil:
    notVisible:
      id: "legal-dob-picker"
    timeout: 30000
