appId: fyi.being.app
tags:
  - safety
name: "Art. 9 consent is refusable (FEAT-470): entry proceeds with the wellness tick unticked"
---
# FEAT-470 safety flow — pins, on the RUNNING app, the one user-visible contract this
# change creates: a user may DECLINE the GDPR Art. 9(2)(a) wellness-processing consent
# and still enter the app.
#
# WHY THIS FLOW EXISTS AT ALL
# ===========================
# The jest side already pins the capture contract
# (CombinedLegalGateScreen.consentInvariant.privacy.test.tsx), but jest renders the tree
# with a mocked consent store — it cannot show that the real Release build lets a refusing
# user through the gate. And no existing flow could cover it:
#   • 7 of the 8 sim safety flows enter via `_seeded-home.yaml`, and the e2e-sim build
#     seeds consent at launch (INFRA-217), so they never see LegalGate at all;
#   • `deeplink-consent-gate.yaml` does reach LegalGate but never ticks a box or presses
#     Continue, so it cannot observe either consent outcome;
#   • `_legal-and-onboarding.yaml` ticks all four and presses Continue — the ACCEPT path
#     only, and it is upstream of most of the suite, so it must not be repurposed.
# Refusal was therefore the one path with no on-device coverage.
#
# WHY THE BOOT STATE IS `?e2eSeed=ungranted`
# ==========================================
# Identical reasoning to `deeplink-consent-gate.yaml`: a consent gate cannot be tested from
# a build that has already granted consent. The marker suppresses the seed's writes only —
# the empty state comes from `clearState` + `clearKeychain`, exactly as a fresh install
# would. `stopApp` + `clearState` + `openLink` rather than `launchApp` because the marker
# must be visible to `Linking.getInitialURL()`, which only carries a URL on a cold start,
# and an intervening `launchApp` would run the seed unmarked and grant consent.
#
# SCOPE — deliberately stops at the gate
# ======================================
# This flow asserts that the gate RELEASES, and nothing further. It does not drive on to
# `home-screen`: that would drag in the 16-question onboarding traversal, which is the slow
# and brittle part of the suite and is already covered by `_legal-and-onboarding.yaml`.
# What happens to a refusing user's data after entry is FEAT-318's write-gate, which does
# not exist yet — asserting anything about it here would pin a contract the code does not
# yet make.
- stopApp
- clearState
- clearKeychain
- openLink: being://daily?e2eSeed=ungranted

# 90s: cold boot + encryption init on the Release build, mirroring the other cold-start
# flows. Landing on the gate is itself the precondition — `being://daily` is a gated link,
# so an ungranted boot resolves to LegalGate.
- extendedWaitUntil:
    visible:
      id: "legal-dob-picker"
    timeout: 90000

# ── The birth year. Required independently of any consent, so it MUST actually be set,
#    or the Continue assertion below would be about the missing year rather than about the
#    Art. 9 tick — the flow would pass for the wrong reason, or hang for the wrong reason.
#
# Mirrors `_legal-and-onboarding.yaml` exactly rather than inventing a shorter version.
# `@react-native-picker/picker` renders an inline UIPickerView on iOS whose wheel items are
# not tappable as text in the accessibility tree, so swiping is the only option, and the
# swipe must both start and end inside the picker's y-range or the parent ScrollView claims
# the gesture and the wheel never moves (INFRA-181). Anchoring on the picker's id keeps the
# coordinates from drifting with layout — and this screen's layout DID change in FEAT-470.
# Years are sorted descending from the current year, placeholder at index 0, so any of these
# lands on a year comfortably over 18.
- tapOn:
    id: "legal-dob-picker"
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
# Fail fast if the wheel did not actually scroll. Without this, an unscrolled wheel leaves
# Continue disabled for a reason that has nothing to do with the Art. 9 tick, and the
# failure would surface 30s later at the final assertion looking like a regression in the
# thing under test.
- assertNotVisible:
    text: "Select year..."

# ── Tick the THREE required acceptances, and deliberately NOT the Art. 9 box ───────────
# testIDs sit on the 24px indicator View, not the outer Pressable (INFRA-181): the
# Pressable's bounding-box centre falls in the text region where an inline
# `Linking.openURL` link would intercept the tap and navigate away. The parent Pressable
# still receives the event via RN tap propagation.
#
# 🔴 `legal-consent-mh-processing` IS NOT TAPPED HERE, AND THAT IS THE ENTIRE POINT.
# Anyone "fixing" a failure in this flow by adding that tap has deleted the test.
- tapOn:
    id: "legal-consent-tos"
- tapOn:
    id: "legal-consent-privacy"
# 🔴 `legal-consent-wellness` IS NOT TAPPED HERE. It is tapped AFTER the scroll below, and
# moving it back up here re-breaks this flow. Measured from the stylesheet at 375x667 (the
# smallest supported viewport): the wellness checkbox's bottom edge sits at ~689pt against
# a ScrollView fold of ~526pt, because the pinned crisis footer takes ~121pt off the
# viewport. It is ~138pt below the fold and ALWAYS HAS BEEN — this is not something
# FEAT-470's added copy caused; the two group headings contribute 25pt of that gap.
# `_legal-and-onboarding.yaml` taps all four here with no scroll and gets away with it only
# because the seeded e2e build skips the legal gate entirely, so that helper's gate steps
# run solely via the device-only `crisis-988-dial` flow on real hardware.

# ── The 988 footer survives the refusal state ─────────────────────────────────────────
# Re-pins DEBUG-390's above-the-fold guarantee in a consent state that did not exist
# before FEAT-470. `LegalGate` is in `RootCrisisButton`'s SUPPRESSED_ROUTES, so this footer
# is the only crisis affordance a user has before accepting anything — and FEAT-470 added
# new conditional copy to this screen, which is exactly the kind of change that can push a
# pinned footer off screen. `assertVisible` defaults to 100% visibility, so this fails if
# either control is even partially clipped. No scroll action: the footer is a flex sibling
# OUTSIDE the ScrollView and must be reachable at the landing offset.
- assertVisible:
    id: "legal-gate-crisis-988"
- assertVisible:
    id: "legal-gate-crisis-text"

# ── THE CONTRACT: Continue releases with the Art. 9 tick withheld ─────────────────────
# `scrollUntilVisible` rather than a blind swipe, per INFRA-181 — and `centerElement`
# because DEBUG-465 established that a control sharing screen coordinates with content
# clipped behind a pinned sibling gets scored visible by XCUITest, so Maestro would skip
# the scroll and tap the wrong thing.
#
# DEBUG-477 (the ScrollView eats the tap) does NOT apply here, and the reason is worth
# stating so nobody "hardens" this with an absorbing tap. That predicate is: a scroll
# terminating MID-CONTENT eats exactly one touch, cleared by a scroll terminating at a
# CONTENT BOUNDARY. `legal-gate-continue` is the LAST child of this ScrollView — nothing
# follows it but `</ScrollView>` — so centring it clamps the scroll at the bottom
# boundary, which is the clearing condition. An absorbing tap would be actively unsafe on
# this screen: every tappable thing here is either a consent checkbox or, below the fold
# line, the pinned 988 footer.
#
# Note this is reasoning from DEBUG-477's predicate, not a measurement on this flow.
- scrollUntilVisible:
    element:
      id: "legal-gate-continue"
    direction: DOWN
    centerElement: true

# ── The third required tick, taken at the BOTTOM offset ───────────────────────────────
# This scroll does double duty, and that is deliberate rather than incidental.
#
#   1. It reveals `legal-consent-wellness`, which is below the fold at the landing offset
#      (see the measurement above). At the bottom clamp the visible window is roughly the
#      last 526pt of ~1089pt of content, and the wellness box sits inside it.
#   2. It CLEARS DEBUG-477's swallowed-tap state. That predicate is: a scroll terminating
#      MID-CONTENT eats exactly one touch, cleared by a scroll terminating at a CONTENT
#      BOUNDARY. `legal-gate-continue` is the LAST child of this ScrollView, so scrolling
#      to it clamps at the bottom boundary — the clearing condition.
#
# This is why the fix is a reorder and not a `scrollUntilVisible` on the wellness box
# itself: centring wellness would terminate mid-content and the very next tap would be
# eaten. The usual remedy — an absorbing tap on an inert element outside the ScrollView —
# is unavailable here, because outside this ScrollView is the pinned 988 footer.
#
# Arrival assertions before each tap, per DEBUG-477's second remedy: without them a scroll
# that landed short is misreported ~30s later as the final `notVisible` timing out, which
# reads like the gate refusing to release — a regression in the exact thing under test.
- assertVisible:
    id: "legal-consent-wellness"
- tapOn:
    id: "legal-consent-wellness"

- assertVisible:
    id: "legal-gate-continue"
- tapOn:
    id: "legal-gate-continue"

# The gate released. Asserted as the DISAPPEARANCE of the gate's own anchor rather than the
# appearance of a downstream screen: what comes next is the onboarding sequence, whose
# first screen has changed more than once, and pinning it here would couple this flow to
# an unrelated surface. If the Art. 9 tick were still mandatory, Continue would be
# `disabled` and the picker would still be on screen.
- extendedWaitUntil:
    notVisible:
      id: "legal-dob-picker"
    timeout: 30000
