appId: fyi.being.app
tags:
  - safety
name: "Legal gate: Art. 9 consent is refusable (FEAT-470 contract)"
# e2e-certifies: 375x667
# INFRA-494 — viewport-load-bearing, must NOT be certified `any`. Every scroll offset
# below is a MEASURED constant of a 375x667 viewport (see the table in the header). On a
# taller device the content fits differently and the drags land somewhere else.
---
# INFRA-494 safety flow — pins the FEAT-470 contract that the GDPR Art. 9(2)(a)
# wellness-processing consent is REFUSABLE: a user may tick the three required consents,
# leave Art. 9 unticked, and still be released through the gate.
#
# Until this flow, NO sim flow drove this screen's interactions at all.
# `deeplink-consent-gate.yaml` reaches the gate and asserts the 988 footer but never ticks
# a box; `_legal-and-onboarding.yaml`'s gate steps execute only on real hardware, because
# the seeded e2e build (INFRA-217) skips the gate entirely and all THREE of that helper's
# callers are device-class — `crisis-988-dial` and `crisis-keyboard-accessory`
# (`safety-device-only`) plus `breathing-fps-budget` (`perf-device-only`). So this
# screen's controls were the one safety surface with no simulator coverage.
#
# ── MEASURED GEOMETRY (iPhone SE 3 / 375x667 / iOS 18.6, `maestro hierarchy`) ─────────
# Everything below is derived from these numbers, not from the stylesheet. Re-measure
# before changing any drag; a `minHeight`-based estimate understates the content badly.
#
#   ScrollView viewport   y 20..553        (from its own scrollbar node)
#   Pinned crisis footer  y 553..667       (114pt, OUTSIDE the ScrollView — DEBUG-390)
#   988 button            y 595..651, x 50..180
#   Scroll offset         0 at landing, CLAMPS at 936
#
#   Element                        content y     on screen at landing
#   "1. Age Verification"          157..179      yes
#   legal-dob-picker               221..437      yes
#   legal-consent-tos              551..575      STRADDLES the clip edge
#   legal-consent-privacy          643..667      fully BEHIND the footer
#   legal-consent-wellness         735..759      below the screen
#   legal-consent-mh-processing    916..940      below the screen
#   legal-gate-continue           1377..1433     below the screen
#
# ── WHY THIS FLOW DOES NOT USE scrollUntilVisible ─────────────────────────────────────
# A previous attempt (FEAT-470, dropped after six suite runs produced one pass) used
# `scrollUntilVisible`, then `centerElement: true`, then `visibilityPercentage: 100`.
# None of them work here, and the reason is structural rather than a matter of parameters:
#
#   XCUITest DROPS elements outside the SCREEN but KEEPS elements that are merely outside
#   a ScrollView's CLIP. `visibilityPercentage` measures against the SCREEN, not against
#   the clip, so a checkbox hidden behind the footer reports 100% VISIBLE (DEBUG-465).
#
# The table above shows both halves of that, measured: at the landing offset
# `legal-consent-privacy` sits at y 643..667 — squarely under the pinned footer, 8pt below
# the 988 button — and is still reported. `scrollUntilVisible` therefore concludes no
# scroll is needed, performs none, and the tap lands on the footer's coordinates. Every
# tap reports COMPLETED and no box ever ticks. The remedy fails because the measurement
# the remedy depends on is the thing that is broken. Do not re-attempt it.
#
# ── WHY THE DRAGS ARE SLOW, AND WHY THAT IS THE WHOLE TECHNIQUE ───────────────────────
# A default-duration `swipe` is a FLICK: measured, a 280pt corridor moves the content
# 482pt, because UIScrollView adds inertial deceleration. That is unusable for landing a
# 24pt checkbox in a 533pt window — and it is what makes a blind swipe ladder overshoot.
#
# The same corridor at `duration: 1200` moves the content 267pt for 280pt of travel: 95%,
# i.e. the finger drags the content and lets go with no velocity. So a slow drag is a
# POSITIONING primitive with a known delta, where a flick is not. Every drag that has to
# land somewhere specific is slow; the only flicks in this flow are the three that run the
# content into its clamp, where overshoot is the point.
#
# Corridor choice: 65%→25% keeps both endpoints inside the ScrollView with the footer's
# xxxLarge Dynamic Type growth allowed for. The footer is 114pt today (top at 82.9%) and
# ~162pt once its `flexWrap` row breaks (top at ~75.7%), so a 65% start stays ~70pt clear
# even in the worst case. A corridor starting at 72% would not.

# ── Boot: cold start into a genuinely ungranted state ─────────────────────────────────
# Same mechanism as `deeplink-consent-gate.yaml`: `?e2eSeed=ungranted` suppresses the
# INFRA-217 seed's writes, so the app boots from the empty state that `clearState` +
# `clearKeychain` produce and resolves to LegalGate. The marker must be visible to
# `Linking.getInitialURL()`, which only carries a URL on a COLD start — hence
# stop/clear/openLink rather than `launchApp`, and the clearing must happen with no
# intervening launch or the seed would grant consent and every assertion below would be
# vacuous.
- stopApp
- clearState
- clearKeychain
- openLink: being://daily?e2eSeed=ungranted

- extendedWaitUntil:
    visible:
      id: "legal-dob-picker"
    timeout: 90000

# ── AC3: the 988 footer is reachable in the refusal state at the LANDING offset ───────
# Asserted BEFORE any scrolling, with no scroll action, because that is the contract:
# LegalGate is in RootCrisisButton's SUPPRESSED_ROUTES, so this inline footer is the ONLY
# crisis affordance a user has before accepting anything.
#
# Deliberately NOT tapped: the simulator's `canOpenURL('tel:988')` returns false
# unconditionally (INFRA-184), so a tap would assert the manual-dial fallback rather than
# reachability. The dial contract belongs to `crisis-988-dial.yaml`.
- assertVisible:
    id: "legal-gate-crisis-988"
- assertVisible:
    id: "legal-gate-crisis-text"

# ── Age: turn the DOB wheel ───────────────────────────────────────────────────────────
# @react-native-picker/picker renders an inline UIPickerView. It is opaque to the
# accessibility tree — one anonymous child, no row nodes — so there is nothing to tap and
# swiping is the only option. Each swipe advances exactly TEN years (measured: 2017, 2007,
# 1997), and years descend from the current year with a null placeholder at index 0, so
# three lands ~29 years back: an adult by a wide margin, and never near the end of the
# 100-entry list.
#
# THE ANCHOR IS THE TECHNIQUE, NOT THE CORRIDOR. INFRA-181 recorded this as "swipe coords
# must start and end inside the picker's y-range, or the parent ScrollView claims the
# gesture". The y-range half is not what saves it — measured here, a fixed-coordinate
# swipe with BOTH endpoints strictly inside the picker's bounds scrolls the PAGE and never
# turns the wheel, at default duration (0% → 31% → 62% → 93%) and at `duration: 1500`
# (0% → 10% → 20% → 31%) alike, with the placeholder still showing. Point taps on a row
# do nothing at all. Only `from: { id: legal-dob-picker }` drives it, and under that form
# the page does not move one percent. Do not "simplify" these into coordinates.
#
# `waitForAnimationToEnd` between the swipes is likewise load-bearing rather than tidy.
# Back-to-back, the fifth swipe fails with "Element not found: legal-dob-picker" against a
# picker that is demonstrably on screen at offset 0 — the wheel's deceleration takes the
# node out of the hierarchy momentarily. Settling between swipes is what makes the step
# deterministic; the same DEBUG-477 family as the checkbox oracle below.
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- waitForAnimationToEnd
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- waitForAnimationToEnd
- swipe:
    from:
      id: "legal-dob-picker"
    direction: UP
- waitForAnimationToEnd

# Paired guard (INFRA-494). `assertNotVisible: "Select year..."` on its own is a FALSE
# GUARD: the placeholder also disappears when the ScrollView steals the swipes and carries
# the picker off the top of the screen. Asserting the picker is still on screen FIRST
# discriminates the two, because a stolen gesture scrolls content UP and XCUITest drops
# what leaves the screen. Order matters — the positive assert has to come first.
#
# The third line is stronger than either and is new here: iOS publishes the wheel's
# SELECTED VALUE as a plain `text` node, so "a year is selected" can be asserted directly
# instead of inferred from the placeholder's absence. Matched as any four digits rather
# than a literal year because the list is built from `new Date().getFullYear()` and a
# literal would start failing on 1 January. The age itself needs no assertion here: an
# under-18 year routes to the "Being is for ages 18+" screen, so the terminal
# "Begin Your Practice" assertion already fails loudly on it.
- assertVisible:
    id: "legal-dob-picker"
- assertNotVisible:
    text: "Select year..."
- assertVisible:
    text: "[0-9]{4}"

# ── Position the three REQUIRED consents into the tappable band ───────────────────────
# ONE slow drag, offset 0 → ~254. Measured result of this exact step:
#
#   legal-consent-tos          y 297..321   ✅ 232pt clear of the footer
#   legal-consent-privacy      y 389..413   ✅ 140pt clear
#   legal-consent-wellness     y 481..505   ✅  48pt clear
#   legal-consent-mh-processing  y 662..686   behind the footer — and NOT tapped
#
# All three required boxes are in the safe band at once, so they are ticked from a single
# resting position and nothing scrolls between the taps. That is deliberate: a ladder that
# re-scrolls between boxes can only overshoot, and one further drag would carry ToS off
# the top of the screen.
- swipe:
    start: "50%, 65%"
    end: "50%, 25%"
    duration: 1200
- waitForAnimationToEnd

# POSITION GUARD — the scroll offset itself, read from the ScrollView.
# iOS publishes the vertical scroll indicator as a node whose `text` is the offset as a
# PERCENTAGE of scrollable range — measured 0% at landing, 29% after this drag, 100% at
# the clamp. That is a direct read of scroll position, so it sidesteps the whole
# out-of-clip-reports-visible defect this screen is governed by: it says where the content
# IS, not whether some element looks visible.
#
# The window is derived, not observed. The three required boxes occupy content y 551..759,
# and the tappable band is y 20..553, so every box is in it exactly when the offset is
# between 206 and 531 of a 936 maximum — i.e. 22%..57%. The drag above lands at 29%,
# near the middle of that window, and a run that drifts outside it fails HERE rather than
# by tapping blind at the pinned footer's coordinates.
#
# Matching cannot collide with the horizontal indicator, which is the only other node of
# this shape: its content is one page wide, so it reads 0% at every offset.
- assertVisible:
    text: "(2[2-9]|3[0-9]|4[0-9]|5[0-7])%"

# The footer is still there at a NON-ZERO offset (crisis review C9). Cheap here and
# genuinely discriminating: under the pre-DEBUG-390 layout, where the footer was the
# ScrollView's last child, it would be off screen at this offset and these two lines would
# red. Placed immediately BEFORE the tap cluster nearest the footer, so a detached footer
# is caught before a blind tap rather than after one.
- assertVisible:
    id: "legal-gate-crisis-988"
- assertVisible:
    id: "legal-gate-crisis-text"

# ── Tick the THREE required consents; NEVER the Art. 9 box ────────────────────────────
# 🔴 `legal-consent-mh-processing` IS NOT TAPPED ANYWHERE IN THIS FLOW, AND THAT IS THE
# ENTIRE POINT. Anyone "fixing" a failure here by adding that tap has deleted the test.
#
# THE ORACLE. Each `-check` testID is on a `<Text>✓</Text>` that renders ONLY when its own
# state is true, so the id EXISTING is the tick. This matters because Maestro reporting a
# tap COMPLETED does not mean the app received it: a scroll that is still decelerating
# consumes the next touch as a zero-distance drag (DEBUG-477), and `retryTapIfNoChange`
# cannot rescue it — the swallowed tap still nudges the list 1-3pt, so Maestro sees a
# change and declines to retry. The oracle is "did the box tick", never "did something
# move". `waitForAnimationToEnd` above already drains the deceleration this flow could
# produce; the loops are what make that belt-and-braces rather than an assumption.
#
# `optional: true` on the in-loop tap is load-bearing: without it a not-yet-tappable
# element aborts the whole loop on its first pass instead of letting the guard re-test.
- repeat:
    times: 3
    while:
      notVisible:
        id: "legal-consent-tos-check"
    commands:
      - tapOn:
          id: "legal-consent-tos"
          optional: true
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-tos-check"

- repeat:
    times: 3
    while:
      notVisible:
        id: "legal-consent-privacy-check"
    commands:
      - tapOn:
          id: "legal-consent-privacy"
          optional: true
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-privacy-check"

# The wellness disclaimer is a crisis control, not a compliance checkbox: its label is the
# screen's crisis instruction verbatim, and it is the only place the user is told what to
# do in a crisis before consenting to anything. That it stays REQUIRED is pinned in jest
# by `__tests__/safety/legalGateE2eOracle.safety.test.tsx`, not here — see the note at the
# refusal assertion below for why it cannot be pinned on-device.
- repeat:
    times: 3
    while:
      notVisible:
        id: "legal-consent-wellness-check"
    commands:
      - tapOn:
          id: "legal-consent-wellness"
          optional: true
      - waitForAnimationToEnd
- assertVisible:
    id: "legal-consent-wellness-check"

# ── The refusal is real: Art. 9 is still unticked ─────────────────────────────────────
# One more slow drag, offset ~254 → ~508, purely to bring the Art. 9 box into the band
# where this pair MEANS something: measured, `legal-consent-mh-processing` lands at
# y ~408..432, fully on screen and above the footer.
#
# The pair is what makes the negative non-vacuous. `assertNotVisible` on the check glyph
# alone passes trivially whenever the box is off screen — and at the content clamp, where
# the gate is actually released, the Art. 9 box sits at y -20..4 and is dropped, so
# asserting it there would prove nothing at all. Asserting the BOX is visible at the same
# offset establishes that its check glyph would be reported too, so its absence is a fact
# about state rather than about scroll position.
#
# NOT pinned here, deliberately: the "wellness is still required" contract. It lives on
# `legal-gate-continue`'s `accessibilityHint` ("… 1 remaining"), and MEASURED on this
# screen, iOS exposes `hintText` as "" on all 70 nodes — including the four checkboxes
# that demonstrably set `accessibilityHint`. Maestro cannot read an accessibilityHint on
# iOS at all, so any `.*1 remaining.*` assertion here is one that can never pass. The
# contract is pinned in jest instead, where the prop is directly readable.
- swipe:
    start: "50%, 65%"
    end: "50%, 25%"
    duration: 1200
- waitForAnimationToEnd
# Second non-zero offset, same reasoning as the ~29% pair above (crisis review C9).
- assertVisible:
    id: "legal-gate-crisis-988"
- assertVisible:
    id: "legal-gate-crisis-text"
- assertVisible:
    id: "legal-consent-mh-processing"
- assertNotVisible:
    id: "legal-consent-mh-processing-check"

# Fail fast, WITH ATTRIBUTION, if any tap above missed its box and landed in the footer.
# `canOpenURL('tel:')` is unconditionally false on the simulator (INFRA-184), so a tap on
# either footer control raises the manual-dial Alert — which is modal, and would swallow
# the Continue tap below. Without this the run would die 30s later on "the gate never
# released", pointing at the thing under test instead of at the stray tap.
- assertNotVisible:
    text: ".*Unable to (Call|Text).*"

# ── Run the content into its clamp to reach Continue ──────────────────────────────────
# FLICKS here, not slow drags, and that inversion is the point: Continue's safe window is
# offset 880..936 — 56pt wide — so no positioning primitive is accurate enough to land in
# it. A UIScrollView CLAMPS at its content boundary instead, so over-swiping is exact
# where aiming is not: measured, the content reaches offset 936 and three further flicks
# are byte-identical no-ops. The count only has to be "enough", never "exact".
#
# At the clamp, `scrollContent`'s `paddingBottom: spacing[32]` leaves Continue at
# y 441..497 — 56pt above the footer's top edge, clear by construction, with no
# visibility measurement involved anywhere.
- swipe:
    start: "50%, 65%"
    end: "50%, 25%"
- swipe:
    start: "50%, 65%"
    end: "50%, 25%"
- swipe:
    start: "50%, 65%"
    end: "50%, 25%"
- waitForAnimationToEnd

# PROVE the clamp was reached (crisis review C10). "Three flicks is enough" is an
# argument; this is the check. It matters because the failure it excludes is the
# incumbent defect in `_legal-and-onboarding.yaml`: at an INTERMEDIATE offset Continue
# can sit inside the footer's 553..667 band, be reported by XCUITest anyway, and be
# tapped — landing the tap on a crisis control while every step still reports COMPLETED.
# Matched as exactly "100%", never widened to `(9[0-9]|100)%`: a 99% reading is evidence
# the flick count has gone short, not noise to be absorbed.
- assertVisible:
    text: "100%"

# ── The 988 footer survives at MAXIMUM scroll depth ───────────────────────────────────
# WHAT THIS IS AND IS NOT (crisis review, INFRA-494). DEBUG-390's "on screen at every
# scroll offset" claim is pinned STRUCTURALLY AND IN CI, by
# `__tests__/safety/crisis-zero-988-windows.test.tsx:131-146` — the footer opens after
# `</ScrollView>` closes, so offset-independence follows from it being a flex sibling of a
# `flex: 1` ScrollView. That is a property of the layout; four samples out of 936 offsets
# could never be the pin for "every offset", and this flow must not be read as one. What
# the runtime samples add is what jest cannot do: confirm the property holds on the
# composited screen. The stakes are why it is worth sampling at all — LegalGate is in
# RootCrisisButton's SUPPRESSED_ROUTES, so a footer that detached at a non-zero offset
# would leave NO 988 affordance at all, pre-consent, on the app's first screen.
#
# THIS PARTICULAR SAMPLE IS THE WEAK ONE, deliberately kept. Run the pre-DEBUG-390 layout
# against the four offsets this flow visits: at 0%, ~29% and ~57% a last-child footer is
# off screen and reds, but at the CLAMP it is the last thing in the content and therefore
# on screen — so this pair alone would pass against the exact defect DEBUG-390 fixed. The
# discriminating samples are the three above; this one covers a different and weaker
# property, survival at maximum content displacement.
#
# `assertVisible` is sound for these two ids specifically BECAUSE the footer is outside
# the ScrollView: the out-of-clip-reports-visible defect that governs everything else on
# this screen cannot apply to it.
- assertVisible:
    id: "legal-gate-crisis-988"
- assertVisible:
    id: "legal-gate-crisis-text"

# ── The gate releases with Art. 9 refused — the contract this flow exists to pin ───────
# Continue is `disabled` on `!selectedYear || !requiredConsentsTicked`
# (CombinedLegalGateScreen.tsx:593), so nothing but a real year plus three real checkbox
# toggles can flip it. That makes gate release the un-spoofable terminal proof: a tap that
# missed and hit the footer leaves Continue dead and the gate shut, and this flow cannot
# green.
- assertVisible:
    id: "legal-gate-continue"
# Re-checked HERE, on the near side of the last gesture cluster (crisis review C11). The
# copy above runs BEFORE the three flicks, so an Alert raised by one of them would slip
# past it, swallow the tap below — it is modal — and surface 30s later as "the gate never
# released", blaming the contract under test instead of the stray tap.
- assertNotVisible:
    text: ".*Unable to (Call|Text).*"
- tapOn:
    id: "legal-gate-continue"

# THE POSITIVE IS THE PROOF, AND IT COMES FIRST — order is load-bearing here.
# Onboarding is where a released gate lands when `onboardingCompleted` is false, which is
# the state `?e2eSeed=ungranted` produces. Selected by text because this control carries
# no testID; `_legal-and-onboarding.yaml` addresses it the same way.
#
# This used to be `extendedWaitUntil: { notVisible: legal-dob-picker }` followed by the
# positive. A mutation run — Art. 9 made required in `requiredConsentsTicked`, so the gate
# can never release — showed that negative passing ANYWAY: the flow arrives here at the
# content clamp, where the picker has scrolled off the top of the screen and XCUITest
# drops it. "The picker is gone" was a statement about scroll offset, not about
# navigation. The mutation was caught by the positive alone, so the negative was carrying
# no weight while reading as if it were.
- extendedWaitUntil:
    visible:
      text: "Begin Your Practice"
    timeout: 30000
# Now non-vacuous, because it runs AFTER the positive: on the onboarding screen there is
# no scroll offset that could hide a LegalGate that was still mounted. Kept because the
# positive alone would also be satisfied by the gate rendering onboarding underneath
# itself.
- assertNotVisible:
    id: "legal-dob-picker"
