appId: fyi.being.app
tags:
  - safety
name: "DailyLoop quick-depth (FEAT-301): crisis affordance survives the shorter arc"
---
# FEAT-301 safety flow — pins the crisis-affordance contract for the per-session
# QUICK depth variant (canonical steps 1→3→4: Aware Presence → Sphere Sovereignty →
# Virtuous Response). Quick OMITS Radical Acceptance (deep's inline crisis-support-line
# carrier), so crisis review (see this PR's crisis sign-off) required the SUPPORT_LINE be
# re-hosted onto a retained, NO-breath-gate beat — Sphere Sovereignty — so it is visible
# the instant the user lands, not hidden behind Aware Presence's 30s breath.
#
# This flow asserts:
#   (1) the root crisis overlay (crisis-button-root, MAINT-290) is reachable from the
#       quick beats (the route name 'DailyLoop' is unchanged, so the overlay coverage
#       holds — quick adds a route PARAM, not a new root route);
#   (2) the re-hosted support line is VISIBLE + tappable → CrisisResources on quick's
#       Sphere Sovereignty beat, NOT behind the breath;
#   (3) (deep sub-check) deep still shows the support line on Radical Acceptance.
#
# ⚠️  DRAFT — NOT YET SIM-VALIDATED. FEAT-301 is a safety surface queued for a
#     simulator-attended /b-close (INFRA-171 Phase 2.5). Validate/adjust selectors +
#     timing on the booted e2e-sim build during that attended session. Known prereqs:
#       • Build with `npm run e2e:safety:build` (no-dev-client EAS e2e-sim, INFRA-216).
#       • FEAT-298 slice 5 retired the `daily_loop` flag — the Daily Practice card is now
#         the unconditional default on Home. If the e2e-sim build
#         ships it dark, enable it in the e2e env before this flow can reach DailyLoop.
#       • Maestro `text:` is a full-match regex and RN merges a11y nodes — the wildcarded
#         text selectors below may need widening (see docs/testing/e2e-maestro.md).

- launchApp:
    clearState: true
    clearKeychain: true # SecureStore-backed consent survives clearState (INFRA-179)
- runFlow: _seeded-home.yaml # INFRA-217: e2e-sim seeds onboarding; start at home

# ── Enter the daily practice (flag-gated card) ───────────────────
- tapOn:
    text: ".*Daily Practice.*"

# ── Depth picker (FEAT-301): two equal choices, pick Quick ───────
- assertVisible:
    id: "daily-loop-depth-select-screen"
- assertVisible:
    id: "daily-loop-depth-quick"
- assertVisible:
    id: "daily-loop-depth-deep"
- tapOn:
    id: "daily-loop-depth-quick"

# ── NO mode picker. FEAT-298 slice 5 retired DailyLoopModeSelectScreen: the tense is
#    inferred from the clock and is never user-picked, so depth is the only choice on
#    entry and the loop goes straight to beat 1. The flow previously tapped
#    `daily-loop-mode-flat` here, which no longer exists.
#
#    Consequence for this flow: the TENSE now varies with wall-clock time, so nothing
#    below may assert tense-specific copy. Everything it does assert — step screen ids,
#    the crisis overlay, the support line, continue/exit controls — is tense-invariant
#    by design, so the flow stays deterministic across all three tenses.

# ── Quick beat 1 — Aware Presence (breath-gated). Root overlay must
#    still be reachable here even during/after the breath. ────────
- assertVisible:
    id: "daily-loop-AwarePresence-screen"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- tapOn:
    id: "nav-back-button"
# Skip the 30s breath to advance to the reflection phase, then Continue.
- tapOn:
    id: "daily-loop-skip-breath"
- tapOn:
    id: "continue-button"

# ── Quick beat 2 — Sphere Sovereignty: the RE-HOSTED support line must
#    be VISIBLE immediately (no breath gate) and tap through to crisis. ─
- assertVisible:
    id: "daily-loop-SphereSovereignty-screen"
- assertVisible:
    id: "daily-loop-support-line"
- tapOn:
    id: "daily-loop-support-line"
- assertVisible:
    id: "crisis-resources-screen"
- tapOn:
    id: "nav-back-button"
- tapOn:
    id: "continue-button"

# ── Quick beat 3 — Virtuous Response is the last beat (no Interconnected
#    Living in quick). Support line must NOT appear here (exactly-once). ─
- assertVisible:
    id: "daily-loop-VirtuousResponse-screen"
- assertNotVisible:
    id: "daily-loop-support-line"

# ── Deep sub-check: re-enter, pick Deeper, confirm the support line is
#    still on Radical Acceptance (deep unchanged). ─────────────────────
- tapOn:
    id: "daily-loop-exit"

# ── Re-entry after an interrupted session (FEAT-298 slice 3b) ────
#    Exiting mid-loop SAVES a resumable session, so re-entering now offers the resume
#    modal rather than the depth picker. Taking "Begin Fresh" here is deliberate: it is
#    the only device coverage of slice 3b's resumption, and it pins the FEAT-301
#    non-sticky rule — a fresh start must RE-PRESENT the neutral depth choice rather
#    than silently inheriting the abandoned session's depth.
- tapOn:
    text: ".*Daily Practice.*"
# Target the button by ID, never by text: the modal's BODY COPY also contains the phrase
# "begin fresh" ("...or begin fresh with full presence now?"), and that <Text> precedes the
# button in the hierarchy — so a text selector taps the paragraph and silently no-ops,
# leaving the modal open.
- extendedWaitUntil:
    visible:
      id: "begin-fresh-button"
    timeout: 15000
- tapOn:
    id: "begin-fresh-button"
- assertVisible:
    id: "daily-loop-depth-select-screen"
- tapOn:
    id: "daily-loop-depth-deep"
- tapOn:
    id: "daily-loop-skip-breath"
- tapOn:
    id: "continue-button"
# Deep beat 2 = Radical Acceptance → support line present here.
- assertVisible:
    id: "daily-loop-RadicalAcceptance-screen"
- assertVisible:
    id: "daily-loop-support-line"
