appId: fyi.being.app
tags:
  - safety
name: "DailyLoop quick-depth (FEAT-301): crisis affordance survives the shorter arc"
---
# FEAT-301 safety flow — pins the crisis-affordance contract for the per-session
# QUICK depth variant (canonical steps 1→3→4: Aware Presence → Sphere Sovereignty →
# Virtuous Response). Quick OMITS Radical Acceptance (deep's inline crisis-support-line
# carrier), so crisis review (see this PR's crisis sign-off) required the SUPPORT_LINE be
# re-hosted onto a retained, NO-breath-gate beat — Sphere Sovereignty — so it is visible
# the instant the user lands, not hidden behind Aware Presence's 30s breath.
#
# This flow asserts:
#   (1) the root crisis overlay (crisis-button-root, MAINT-290) is reachable from the
#       quick beats (the route name 'DailyLoop' is unchanged, so the overlay coverage
#       holds — quick adds a route PARAM, not a new root route);
#   (2) the re-hosted support line is VISIBLE + tappable → CrisisResources on quick's
#       Sphere Sovereignty beat, NOT behind the breath;
#   (3) (deep sub-check) deep still shows the support line on Radical Acceptance.
#
# ✅ SIM-VALIDATED 2026-08-04 (FEAT-298 slice 6c close-out) — attended run on the
#     no-dev-client e2e-sim build, iPhone 16 Plus / iOS 18.6, green as part of a full
#     6-flow `npm run e2e:safety` pass. What the validation changed:
#       • Removed the mode-picker steps — FEAT-298 slice 5 retired
#         DailyLoopModeSelectScreen, so the tense is inferred from the clock and depth is
#         the only entry choice. NOTHING below may assert tense-specific copy: everything
#         it does assert is tense-invariant, so the flow stays deterministic all day.
#       • The re-entry pass now goes through the resume modal (FEAT-298 slice 3b) via
#         `begin-fresh-button`. Targeting that button BY ID is required, not stylistic:
#         the modal's body copy also contains the phrase "begin fresh", and a text
#         selector matches that paragraph first and silently no-ops.
#       • The `daily_loop` flag no longer exists — the Daily Practice card is the
#         unconditional default on Home, so there is no flag to enable in the e2e env.
#
# ✅ RE-VALIDATED 2026-08-12 (DEBUG-408) — build aeb525ac, clean-tree provenance.
#
#     READ THIS BEFORE INVESTIGATING A RED RESULT HERE. DEBUG-408 was filed reporting
#     that `tapOn continue-button` on Sphere Sovereignty failed because the button was
#     below the fold. IT WAS NOT. That flow step, and this flow entire, passed on every
#     device tested once the simulator was healthy:
#
#       device / runtime                      viewport   unmodified flow
#       ────────────────────────────────────  ─────────  ───────────────
#       iPhone 16 Pro Max  / iOS 18.6         430x932    PASS
#       iPhone 16e         / iOS 18.6         390x844    PASS
#       iPhone 16e         / iOS 26.0         390x844    PASS
#       iPhone 17 Pro      / iOS 26.0         402x874    FAIL, then PASS after erase
#
#     ROOT CAUSE: corrupted simulator state on one iPhone 17 Pro instance. Its Maestro
#     XCUITest driver died mid-flow — `java.net.ConnectException: Connection refused` on
#     the driver port, inside `Maestro.waitForAppToSettle` — and Maestro reports the
#     aftermath as `Element not found`, which is indistinguishable from a below-the-fold
#     miss. `xcrun simctl erase <udid>` fixed it, after which the ORIGINAL unmodified
#     flow passed on that same device. Reproduced on a quiet machine, so it was not
#     contention. The tell was that the failing STEP MOVED between runs
#     (continue-button → skip-breath → nav-back-button): a layout defect is deterministic
#     about which element it hides; a crashing driver fails wherever the crash lands.
#
#     So if this flow goes red: erase the simulator and re-run BEFORE reading the failing
#     step as a real regression. Then check `~/.maestro/tests/<latest>/maestro.log` for
#     `ConnectException` / `EOFException` — the console output does not surface them.
#
#     THE DEVICE IS AN UNPINNED INPUT. `app/scripts/e2e-sim-device.sh` resolves whichever
#     simulator happens to be booted; it enforces that exactly ONE is (INFRA-405) but
#     pins no model and no iOS version. This header records what WAS tested and
#     guarantees nothing about what will run. Pinning the model is INFRA scope.
#
#     What DEBUG-408 changed below is hardening and coverage, NOT a fix for the above:
#     a re-anchor assertion after every crisis round-trip (which pins the previously
#     unasserted property that the round-trip is non-destructive to the practice
#     session), and a conditional breath-skip. Deliberately NOT added: any
#     `scrollUntilVisible`. There was no fold to harden against, and a scroll here would
#     have written a false causal story into a safety flow for the next reader.

- launchApp:
    clearState: true
    clearKeychain: true # SecureStore-backed consent survives clearState (INFRA-179)
- runFlow: _seeded-home.yaml # INFRA-217: e2e-sim seeds onboarding; start at home

# ── Enter the daily practice (flag-gated card) ───────────────────
- tapOn:
    text: ".*Daily Practice.*"

# ── Depth picker (FEAT-301): two equal choices, pick Quick ───────
- assertVisible:
    id: "daily-loop-depth-select-screen"
- assertVisible:
    id: "daily-loop-depth-quick"
- assertVisible:
    id: "daily-loop-depth-deep"
- tapOn:
    id: "daily-loop-depth-quick"

# ── NO mode picker. FEAT-298 slice 5 retired DailyLoopModeSelectScreen: the tense is
#    inferred from the clock and is never user-picked, so depth is the only choice on
#    entry and the loop goes straight to beat 1. The flow previously tapped
#    `daily-loop-mode-flat` here, which no longer exists.
#
#    Consequence for this flow: the TENSE now varies with wall-clock time, so nothing
#    below may assert tense-specific copy. Everything it does assert — step screen ids,
#    the crisis overlay, the support line, continue/exit controls — is tense-invariant
#    by design, so the flow stays deterministic across all three tenses.

# ── Quick beat 1 — Aware Presence (breath-gated). Root overlay must
#    still be reachable here even during/after the breath. ────────
- assertVisible:
    id: "daily-loop-AwarePresence-screen"
- tapOn:
    id: "crisis-button-root"
- assertVisible:
    id: "crisis-resources-screen"
- tapOn:
    id: "nav-back-button"
# RE-ANCHOR after the crisis round-trip (DEBUG-408). Required after EVERY
# `nav-back-button` in this flow, and it is coverage, not ceremony: it pins that the
# crisis round-trip is NON-DESTRUCTIVE to the practice session — you return to the beat
# you left, not to a dead screen, a re-entered loop, or the depth picker. Nothing
# asserted that before. It also gives Maestro a retried settle point against a
# hierarchy that is still mid-transition, which is what both DEBUG-408 failures needed.
- assertVisible:
    id: "daily-loop-AwarePresence-screen"
# Advance past the 30s breath to the reflection phase.
#
# CONDITIONAL, and the asymmetry with the deep sub-check below is deliberate. The breath
# runs on a wall clock that does NOT pause during the crisis round-trip above, so if that
# round-trip stalls, the breath can auto-complete and take the SkipLink with it. This is
# not hypothetical — it was observed during DEBUG-408, with a Maestro failure screenshot
# showing the reflection phase fully rendered and no breath UI at all. But it is
# HARDENING, NOT THE DEBUG-408 FIX: it was only ever reachable because Maestro's retries
# stretched past 30s on a sick simulator (see the header). On a healthy device the
# round-trip costs a few seconds against 30s of margin, and the tap branch is taken.
# Either path reaches the same state; the breath gate is scaffolding here, not the
# contract.
#
# The two assertions below exist because a `when:` block that silently no-ops is exactly
# the "passing step that proved nothing" shape docs/testing/e2e-maestro.md warns about:
#   • assertNotVisible pins that the gate is actually GONE — if the conditional skipped
#     while the breath was still running, the SkipLink would still be mounted and this
#     goes red.
#   • assertVisible pins that the reflection phase actually RENDERED. It is deliberately
#     NOT `continue-button`: that element is the one under suspicion in this defect, so
#     it must not double as the thing that proves the step. `daily-loop-input-response`
#     is tense-invariant — AwarePresence declares exactly one field, key `response`, in
#     all three ModeConfigs — so it keeps the flow deterministic across all tenses.
- runFlow:
    when:
      visible:
        id: "daily-loop-skip-breath"
    commands:
      - tapOn:
          id: "daily-loop-skip-breath"
- assertNotVisible:
    id: "daily-loop-skip-breath"
- assertVisible:
    id: "daily-loop-input-response"
- tapOn:
    id: "continue-button"

# ── Quick beat 2 — Sphere Sovereignty: the RE-HOSTED support line must
#    be VISIBLE immediately (no breath gate) and tap through to crisis. ─
- assertVisible:
    id: "daily-loop-SphereSovereignty-screen"
# NEVER PUT A SCROLL IN FRONT OF THIS ASSERTION — not here, not on any beat, not at any
# depth. Maestro resolves against what is on screen, so this assertion at scroll offset 0
# IS the above-the-fold pin on the crisis affordance, and it is the only thing pinning it.
# FEAT-301 re-hosted the support line onto Sphere Sovereignty precisely so a distressed
# user meets it the instant they land. If this ever goes red, FIX THE LAYOUT. A
# `scrollUntilVisible` here would turn it green while deleting the property it exists to
# protect. (The step below is a different matter: `continue-button` is not a crisis
# affordance and carries no reachability contract.)
- assertVisible:
    id: "daily-loop-support-line"
- tapOn:
    id: "daily-loop-support-line"
- assertVisible:
    id: "crisis-resources-screen"
- tapOn:
    id: "nav-back-button"
# RE-ANCHOR after the crisis round-trip — see the Aware Presence site above. This is the
# exact seam DEBUG-408 was filed against: the ticket's `tapOn continue-button` failure
# landed here, on the first tap after this `nav-back-button`, and was read as
# `continue-button` being below the fold. It was not. `continue-button` has never been
# below the fold on this beat on ANY device tested — see the header matrix.
- assertVisible:
    id: "daily-loop-SphereSovereignty-screen"
- tapOn:
    id: "continue-button"

# ── Quick beat 3 — Virtuous Response is the last beat (no Interconnected
#    Living in quick). Support line must NOT appear here (exactly-once). ─
- assertVisible:
    id: "daily-loop-VirtuousResponse-screen"
# KNOWN-WEAK NEGATIVE, deliberately left alone (DEBUG-408 crisis pass). Because Maestro
# resolves against what is on screen, this would also pass if the support line were
# present but merely below the fold. Do not try to strengthen it here — the "exactly once
# per depth" invariant is owned at the DATA level by `showsSupportLine()` and asserted in
# tenseMode.test.ts, which is where it belongs and where it cannot be fooled by a viewport.
- assertNotVisible:
    id: "daily-loop-support-line"

# ── Deep sub-check: re-enter, pick Deeper, confirm the support line is
#    still on Radical Acceptance (deep unchanged). ─────────────────────
- tapOn:
    id: "daily-loop-exit"

# ── Re-entry after an interrupted session (FEAT-298 slice 3b) ────
#    Exiting mid-loop SAVES a resumable session, so re-entering now offers the resume
#    modal rather than the depth picker. Taking "Begin Fresh" here is deliberate: it is
#    the only device coverage of slice 3b's resumption, and it pins the FEAT-301
#    non-sticky rule — a fresh start must RE-PRESENT the neutral depth choice rather
#    than silently inheriting the abandoned session's depth.
- tapOn:
    text: ".*Daily Practice.*"
# Target the button by ID, never by text: the modal's BODY COPY also contains the phrase
# "begin fresh" ("...or begin fresh with full presence now?"), and that <Text> precedes the
# button in the hierarchy — so a text selector taps the paragraph and silently no-ops,
# leaving the modal open.
- extendedWaitUntil:
    visible:
      id: "begin-fresh-button"
    timeout: 15000
- tapOn:
    id: "begin-fresh-button"
- assertVisible:
    id: "daily-loop-depth-select-screen"
- tapOn:
    id: "daily-loop-depth-deep"
# NOT conditional, unlike the Aware Presence site above, and the asymmetry is the point:
# no crisis round-trip precedes this tap, so nothing here can burn 30 seconds of wall
# clock before we reach the SkipLink. Leaving it unconditional keeps this a real
# assertion — a `when:` block here could only ever hide a genuine regression.
- tapOn:
    id: "daily-loop-skip-breath"
- tapOn:
    id: "continue-button"
# Deep beat 2 = Radical Acceptance → support line present here.
- assertVisible:
    id: "daily-loop-RadicalAcceptance-screen"
- assertVisible:
    id: "daily-loop-support-line"
